<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NEXUS AI — Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root{--bg:#171717;--s1:#212121;--s2:#2a2a2a;--s3:#343434;--b:#333;--t:#ececec;--m:#9b9b9b;--g:#10b981;--r:#ef4444;--y:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:99px}
body{font:14px/1.5 'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
h2,h3,h4{font-weight:700;line-height:1.3}code,pre,.mono{font-family:'JetBrains Mono',monospace}
a{color:#60a5fa;cursor:pointer;text-decoration:none}
button,input,select,textarea{font:inherit;color:var(--t);background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:9px 12px;outline:none;transition:.15s;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:#666;background:#262626}
button{cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button:hover{background:var(--s3)}button:active{transform:scale(.98)}
.btn{background:#fff;color:#111;border:none;font-weight:700}.btn:hover{background:#e5e5e5;color:#111}
.btn-g{background:rgba(16,185,129,.16);color:#34d399;border-color:rgba(16,185,129,.4)}
.btn-r{background:rgba(239,68,68,.16);color:#f87171;border-color:rgba(239,68,68,.4)}
.btn-y{background:linear-gradient(135deg,#f59e0b,#d97706);color:#111;border:none;font-weight:700}
.sm{padding:6px 10px;font-size:12px;border-radius:8px}.mut{font-size:12px;color:var(--m);line-height:1.45}.w1{width:100%}.hd{display:none!important}
.lbl{font-size:11px;font-weight:600;color:var(--m);margin-bottom:4px;display:block}
.top{height:54px;background:var(--bg);border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:8px;position:sticky;top:0;z-index:40;flex-wrap:nowrap}
.logo{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.wrap{display:flex;flex:1;min-height:0}.side-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:85;display:none}.side-bg.on{display:block}
.side{width:265px;background:var(--s1);border-right:1px solid var(--b);padding:12px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.nav{background:transparent;border:none;justify-content:flex-start;padding:10px 12px;border-radius:10px;color:var(--m);font-weight:500;width:100%}
.nav i{font-size:18px}.nav:hover,.nav.act{background:var(--s2);color:var(--t)}.nav.act{font-weight:600}
.acc-btn{margin-top:auto;background:var(--s2);border:1px solid var(--b);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;width:100%}
.acc-btn:hover{background:var(--s3);border-color:#555}
.ava{width:36px;height:36px;border-radius:50%;background:#383838;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.main{flex:1;padding:16px;overflow-y:auto;max-width:1100px;width:100%;margin:0 auto}
.card{background:var(--s1);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:12px}
.plan-card{background:var(--s1);border:1px solid var(--b);border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.plan-card.pop{border:2px solid #10b981;background:linear-gradient(180deg,rgba(16,185,129,.08),var(--s1) 40%)}
.plan-card.vip{border:2px solid #f59e0b;background:linear-gradient(180deg,rgba(245,158,11,.08),var(--s1) 40%)}
.price-big{font-size:28px;font-weight:800;color:#fff}
.feat-list{display:flex;flex-direction:column;gap:8px;font-size:13px;color:#d4d4d4}.feat-list div{display:flex;align-items:center;gap:8px}.feat-list i{color:var(--g);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:10px}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--s2);border:1px solid var(--b);color:var(--m);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.g{color:#34d399;border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.1)}
.tag.r{color:#f87171;border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.1)}
.tag.y{color:#fbbf24;border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.1)}
.msgs{height:55vh;min-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 0}
.msg{max-width:88%;padding:12px 15px;border-radius:14px;background:var(--s1);border:1px solid var(--b);white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:#2f2f2f;border-color:#444}
.msg pre{background:#111;border:1px solid var(--b);padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0;font-size:12px;white-space:pre}
.think{background:var(--s2);border-left:3px solid #777;padding:8px 10px;margin-bottom:8px;font-size:12px;color:var(--m);border-radius:6px}
.bar{height:7px;background:var(--s2);border-radius:99px;overflow:hidden;margin:4px 0}.bar>i{display:block;height:100%;background:var(--g);border-radius:99px}
.mod,.ban{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:14px;z-index:100;background:rgba(0,0,0,.78)}
.mod.on,.ban.on{display:flex}.mod-in{background:var(--s1);border:1px solid #444;border-radius:16px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.ban{background:rgba(35,6,6,.92);color:#fecaca;z-index:110;text-align:center;flex-direction:column}
.toast{position:fixed;bottom:18px;right:18px;left:18px;max-width:360px;margin:0 auto;background:#262626;border:1px solid #555;padding:11px 15px;border-radius:10px;z-index:105;display:none}
.toast.on{display:flex;align-items:center;gap:8px}
.ad{background:var(--s1);border:1px solid var(--b);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
iframe.sbx{width:100%;height:65vh;border:none;background:#fff;border-radius:10px}.mob-btn{display:none}
@media(max-width:860px){.desk-only{display:none!important}.side{position:fixed;left:-275px;top:0;bottom:0;z-index:90;transition:.2s}.side.on{left:0}.mob-btn{display:inline-flex}.msg{max-width:96%}}
</style>
</head>
<body>
<div id="side-bg" class="side-bg" onclick="toggleMenu(false)"></div>
<header class="top">
  <div class="row" style="flex-wrap:nowrap">
    <button class="mob-btn sm" onclick="toggleMenu(true)"><i class="ri-menu-line"></i></button>
    <div class="logo"><i class="ri-openai-fill"></i><span>NEXUS Arena</span></div>
  </div>
  <div id="stats-bar" class="row mut desk-only"></div>
  <div class="row" style="flex-wrap:nowrap">
    <button class="sm btn-y" onclick="go('bill')"><i class="ri-vip-crown-fill"></i>PRO / ULTRA</button>
    <button class="sm" onclick="S.msgs=[];localStorage.setItem('nx_msgs','[]');go('chat')"><i class="ri-add-line"></i>Новый чат</button>
  </div>
</header>
<div class="wrap">
  <aside id="side" class="side">
    <div class="row sp mob-btn" style="padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--b)">
      <b>NEXUS Arena</b><button class="sm" onclick="toggleMenu(false)">✕</button>
    </div>
    <button class="nav act" data-t="chat" onclick="go('chat')"><i class="ri-chat-3-line"></i>Чат с ИИ</button>
    <button class="nav" data-t="cat" onclick="go('cat')"><i class="ri-compass-3-line"></i>Каталог моделей</button>
    <button class="nav" data-t="bill" onclick="go('bill')"><i class="ri-vip-diamond-line" style="color:var(--y)"></i>Тарифы и Сброс 5ч <span class="tag y" style="margin-left:auto">ХИТ</span></button>
    <button class="nav" data-t="keys" onclick="go('keys')"><i class="ri-key-2-line"></i>Заработок на ключах</button>
    <button class="nav" data-t="sbx" onclick="go('sbx')"><i class="ri-code-box-line"></i>HTML Песочница</button>
    <button class="nav" id="nav-adm" data-t="adm" onclick="go('adm')"><i class="ri-shield-star-line"></i>Админ-панель</button>
    <div id="acc-box" class="acc-btn" onclick="openAccountModal()">
      <div class="ava" id="acc-ava">U</div>
      <div style="flex:1;min-width:0">
        <div class="row sp" style="gap:4px"><b id="acc-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Профиль</b><span class="tag g" id="acc-plan">FREE</span></div>
        <div class="mut" id="acc-mail" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Загрузка...</div>
      </div>
      <i class="ri-settings-4-line mut"></i>
    </div>
  </aside>
  <main class="main"><div id="ad-box" class="ad hd"></div><div id="view"></div></main>
</div>
<div id="mod" class="mod" onclick="if(event.target===this)closeMod()"><div id="mod-in" class="mod-in"></div></div>
<div id="ban" class="ban"></div>
<div id="toast" class="toast"></div>
<script>
const API='https://omni-api.aegertcool.workers.dev',$=id=>document.getElementById(id),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.S={tok:localStorage.getItem('nx_tok')||localStorage.getItem('token')||'',user:JSON.parse(localStorage.getItem('nx_user_cache')||'null'),
ad:null,cap:null,needCode:false,authMode:'login',cat:[],mid:+localStorage.getItem('nx_mid')||0,
msgs:JSON.parse(localStorage.getItem('nx_msgs')||'[]'),mem:JSON.parse(localStorage.getItem('nx_mem')||'[]'),tab:'chat',cStep:0,sbx:[],payInfo:{}};
function toggleMenu(on){$('side').classList.toggle('on',on);$('side-bg').classList.toggle('on',on)}
function resetDevIds(){
 ['nx_trusted_dev','nx_trusted_hw','nx_dev','nx_hw','deviceId','hwHash'].forEach(k=>localStorage.removeItem(k));
 const d='d_'+Math.random().toString(36).slice(2)+Date.now().toString(36),h='hw_'+Math.random().toString(16).slice(2)+Date.now().toString(16);
 localStorage.setItem('nx_dev_v4',d);localStorage.setItem('nx_hw_v4',h);return{d,h};
}
function getDev(){
 let d=localStorage.getItem('nx_dev_v4'),h=localStorage.getItem('nx_hw_v4');
 return(!d||!h)?resetDevIds():{d,h};
}
function toast(m){const t=$('toast');t.innerHTML=`<i class="ri-checkbox-circle-fill" style="color:var(--g)"></i><span>${esc(m)}</span>`;t.classList.add('on');clearTimeout(window._tT);window._tT=setTimeout(()=>t.classList.remove('on'),3500)}
function openMod(h){$('mod-in').innerHTML=h;$('mod').classList.add('on')}
function closeMod(){$('mod').classList.remove('on')}
async function api(p,o={},retried=false){
 try{
  const {d,h}=getDev();
  const r=await fetch(API+p,{method:o.method||(o.body?'POST':'GET'),headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.tok,'X-Device-Id':d,'X-Hw-Hash':h},body:o.body?JSON.stringify(o.body):undefined});
  const data=await r.json().catch(()=>({}));
  if(r.status===403&&data.errorCode==='DEVICE_BANNED'){
   if(!retried){resetDevIds();return api(p,o,true)}
   if(!sessionStorage.getItem('hide_ban'))showBan(data.reasons);
   return{status:403,ok:false,data};
  }
  return{status:r.status,ok:r.ok&&data.ok!==false,data};
 }catch(e){return{status:0,ok:false,data:{error:'Ошибка сети'}}}
}
function showBan(rs){
 const b=$('ban');b.classList.add('on');
 b.innerHTML=`<div class="card col" style="max-width:460px;background:#1f0707;border-color:var(--r)">
  <div class="row sp"><b>⚠️ Блокировка устройства / VPN IP</b><button class="sm" onclick="sessionStorage.setItem('hide_ban','1');$('ban').classList.remove('on')">✕ Закрыть окно</button></div>
  <p>${esc(Array.isArray(rs)?rs.join(', '):(rs||'Нарушение правил'))}</p>
  <p class="mut" style="color:var(--y)">Совет для создателя: переключите VPN (чтобы сменить IP) и нажмите зелёную кнопку ниже!</p>
  <input id="ban-u" class="w1" placeholder="Ваш никнейм" value="${esc(S.user?.username||'asdcreator')}">
  <textarea id="ban-m" class="w1" rows="2" placeholder="Причина для разбана...">Разбан создателя</textarea>
  <button class="btn w1" onclick="sendAppeal()">1. Отправить обжалование</button>
  <button class="btn-g w1" onclick="autoUnbanCreator()">⚡ 2. Сбросить ID железа и Разбанить себя</button></div>`;
}
async function sendAppeal(){
 const {ok,data}=await api('/api/ban/appeal',{body:{username:$('ban-u').value,message:$('ban-m').value}});
 toast(ok?'Апелляция отправлена! Теперь нажмите зелёную кнопку ниже':(data.error||'Ошибка'));
}
async function autoUnbanCreator(){
 resetDevIds();sessionStorage.setItem('hide_ban','1');$('ban').classList.remove('on');
 const r=await api('/api/admin/overview');
 if(r.ok&&r.data?.appeals){for(const a of r.data.appeals)await api('/api/admin/appeal',{body:{appealId:a.id,id:a.id,approve:true}})}
 toast('Железо сброшено! Если бан висит — смените сервер в VPN');loadMe();
}
</script>
<script>
function updateSidebarAccount(){
 if(!S.tok||!S.user){$('acc-ava').textContent='→';$('acc-name').textContent='Войти / Регистрация';$('acc-plan').textContent='Гость';$('acc-mail').textContent='Нажмите для входа';return}
 $('acc-ava').textContent=(S.user.username||'U')[0].toUpperCase();
 $('acc-name').textContent=S.user.username;$('acc-plan').textContent=(S.user.plan||'FREE').toUpperCase();
 $('acc-mail').textContent=S.user.email||'Почта подтверждена';
}
function openAccountModal(){
 if(!S.tok||!S.user)return go('auth');
 const u=S.user,l=u.limits||{},w=u.wallet||{},bar=(a,b)=>`<div class="bar"><i style="width:${Math.min(100,((a||0)/(b||1))*100)}%"></i></div>`;
 openMod(`<div class="col">
  <div class="row sp"><div class="row"><div class="ava" style="width:42px;height:42px">${esc((u.username||'U')[0].toUpperCase())}</div>
   <div><h3>${esc(u.username)} <span class="tag g">${esc(u.plan||'FREE')}</span></h3><div class="mut">📧 Gmail: <b>${esc(u.email||'не указан')}</b></div></div></div>
   <button class="sm" onclick="closeMod()">✕</button></div>
  <div class="card col" style="margin:0;padding:12px;background:var(--s2)">
   <span class="lbl">🎟 ВВЕСТИ ПРОМОКОД</span>
   <div class="row"><input id="mod-prm" placeholder="Промокод..." style="flex:1"><button class="btn sm" onclick="pAct('/api/promo/redeem',{code:$('mod-prm').value});closeMod()">Активировать</button></div>
  </div>
  <div class="card col" style="margin:0;padding:12px">
   <div class="row sp"><span>🔥 Бонус-стрик: <b>${u.checkinStreak||0} дн.</b></span><button class="sm btn-g" onclick="pAct('/api/bonus/checkin',{});closeMod()">🎁 Забрать бонус</button></div>
   <div><span class="lbl">Лимит 5ч: ${l.used5h||0} / ${l.cap5h||0}</span>${bar(l.used5h,l.cap5h)}</div>
   <div><span class="lbl">Неделя: ${l.usedWeek||0} / ${l.capWeek||0}</span>${bar(l.usedWeek,l.capWeek)}</div>
   <div><span class="lbl">Месяц: ${l.usedMonth||0} / ${l.capMonth||0}</span>${bar(l.usedMonth,l.capMonth)}</div>
   <div class="row sp mut"><span>Реф-код: <b class="mono">${esc(u.refCode||'-')}</b></span><button class="sm btn-y" onclick="closeMod();go('bill')">⚡ Купить PRO / ULTRA</button></div>
  </div>
  <div class="card col" style="margin:0;padding:12px">
   <span class="lbl">💰 Кошелёк: ${w.balanceRub||0} ₽ (вывод от 300 ₽)</span>
   <div class="row"><input id="wd-d" placeholder="Карта / СБП" style="flex:1"><button class="sm btn" onclick="if((${w.balanceRub||0})<300)return toast('От 300 ₽!');pAct('/api/wallet/withdraw',{details:$('wd-d').value})">Вывести</button></div>
  </div>
  <button class="sm btn-r w1" onclick="closeMod();logout()">Выйти из аккаунта (${esc(u.username)})</button></div>`);
}
async function loadStats(){
 const {ok,data}=await api('/api/stats');
 if(ok){
  $('stats-bar').innerHTML=`<span class="tag">👥 Юзеров: ${data.users||0}</span><span class="tag">🤖 Моделей: ${data.models||0}</span><span class="tag">⚡ Запросов: ${data.requests||0}</span>`;
  if(data.ad?.enabled){$('ad-box').classList.remove('hd');$('ad-box').innerHTML=`<div><b>${esc(data.ad.title)}</b> <span class="mut">${esc(data.ad.text)}</span></div>`+(data.ad.url?`<a class="btn sm" target="_blank" href="${esc(data.ad.url)}">Перейти</a>`:'')}
 }
}
async function loadMe(){
 updateSidebarAccount();
 if(!S.tok)return go(['cat','adm','sbx','bill'].includes(S.tab)?S.tab:'auth');
 const {status,ok,data}=await api('/api/auth/me');
 if(status===401){S.tok='';S.user=null;localStorage.removeItem('nx_tok');localStorage.removeItem('nx_user_cache');updateSidebarAccount();return go('auth')}
 if(ok&&data.user){
  S.user=data.user;localStorage.setItem('nx_user_cache',JSON.stringify(S.user));updateSidebarAccount();
  for(const dv of(S.user.devices||[])){if(!dv.is_trusted&&!dv.trusted)api('/api/devices/trust',{body:{deviceRowId:dv.id}})}
 }
 go(S.tab==='auth'?'chat':S.tab);
}
function logout(){S.tok='';S.user=null;localStorage.removeItem('nx_tok');localStorage.removeItem('nx_user_cache');updateSidebarAccount();go('auth')}
function go(t){
 toggleMenu(false);if(!S.tok&&!['auth','cat','adm','sbx','bill'].includes(t))t='auth';
 S.tab=t;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('act',n.dataset.t===t));
 if(t==='auth')renderAuth();else if(t==='chat')renderChat();else if(t==='cat')renderCat();else if(t==='sbx')renderSbxPage();else if(t==='keys')renderKeys();else if(t==='bill')renderBill();else if(t==='adm')renderAdm();
}
async function loadCap(){const {ok,data}=await api('/api/captcha/challenge');if(ok){S.cap=data;if($('cap-q'))$('cap-q').textContent=data.question}}
function showRules(){openMod(`<div class="col"><h3>Правила NEXUS AI (199-ФЗ РФ)</h3><p class="mut">Авторизация осуществляется напрямую через логин и почту без зарубежных сервисов (199-ФЗ РФ). Запрещены мультиаккаунты и абуз лимитов.</p><button class="btn w1" onclick="closeMod()">Понятно</button></div>`)}
function renderAuth(){
 const reg=S.authMode==='register';
 $('view').innerHTML=`<div class="card col" style="max-width:420px;margin:20px auto">
  <div class="row sp"><h3>${reg?'Регистрация':'Вход в NEXUS AI'}</h3><span class="tag">199-ФЗ РФ</span></div>
  <div class="row"><button class="w1 ${!reg?'btn':''}" onclick="S.authMode='login';renderAuth()">Вход</button><button class="w1 ${reg?'btn':''}" onclick="S.authMode='register';renderAuth()">Регистрация</button></div>
  <div><span class="lbl">Логин</span><input id="au-u" class="w1" placeholder="asdcreator"></div>
  ${reg?'<div><span class="lbl">Почта (Gmail / Mail / Яндекс)</span><input id="au-e" type="email" class="w1" placeholder="you@gmail.com"></div>':''}
  <div><span class="lbl">Пароль</span><input id="au-p" type="password" class="w1" placeholder="••••••••"></div>
  ${reg?'<div><span class="lbl">Реферальный код</span><input id="au-ref" class="w1" placeholder="Необязательно"></div>':''}
  <div class="row"><span class="tag">Капча: <b id="cap-q">...</b></span><input id="cap-a" placeholder="Ответ" style="flex:1"><button class="sm" onclick="loadCap()">↻</button></div>
  ${reg||S.needCode?`<div class="row"><input id="au-c" placeholder="5-значный код с почты" style="flex:1"><button class="sm btn-g" onclick="sendCode('${S.authMode}')">Получить код</button></div>`:''}
  ${reg?`<label class="row mut"><input type="checkbox" id="au-r" checked> Принимаю <a onclick="showRules()">Правила проекта</a></label>`:''}
  <button class="btn w1" onclick="doAuth()">${reg?'Создать аккаунт':'Войти'}</button></div>`;loadCap();
}
async function sendCode(mode){const {ok,data}=await api('/api/auth/send-code',{body:{mode,username:$('au-u').value.trim(),email:$('au-e')?.value.trim()||'',challengeToken:S.cap?.challengeToken,captchaAnswer:$('cap-a').value.trim()}});toast(ok?'Код отправлен на почту!':(data.error||'Ошибка'));loadCap()}
async function doAuth(){
 const reg=S.authMode==='register',u=$('au-u').value.trim(),p=$('au-p').value,c=$('au-c')?.value.trim()||'',ca=$('cap-a').value.trim(),ct=S.cap?.challengeToken;
 if(reg&&!$('au-r').checked)return toast('Примите Правила!');
 const {status,ok,data}=await api(reg?'/api/auth/register':'/api/auth/login',{body:reg?{username:u,email:$('au-e').value.trim(),password:p,refCode:$('au-ref').value.trim(),rulesAccepted:true,emailCode:c,challengeToken:ct,captchaAnswer:ca}:{username:u,password:p,emailCode:c,challengeToken:ct,captchaAnswer:ca}});
 if(status===403&&data.needEmailCode){S.needCode=true;renderAuth();return toast('Введите 5-значный код с почты!')}
 if(!ok){loadCap();return toast(data.error||'Ошибка входа')}
 S.tok=data.token;localStorage.setItem('nx_tok',S.tok);S.needCode=false;await loadMe();
}
function fmtMsg(m,i){
 let h=esc(m.content||'');
 if(m.thinking)h=`<details class="think"><summary>💭 Мышление модели</summary><div style="margin-top:4px">${esc(m.thinking)}</div></details>`+h;
 h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>{const isH=l.toLowerCase()==='html'||c.includes('<html')||c.includes('<!DOCTYPE')||c.includes('<body');S.sbx[i]=c;return`<pre>${c}</pre>`+(isH?`<button class="sm btn-g" onclick="runSbx(${i})">▶ Запустить HTML</button>`:'')});
 return`<div class="msg ${m.role==='user'?'u':''}"><div>${h}</div>${m.meta?`<div class="mut" style="margin-top:6px">${esc(m.meta)}</div>`:''}</div>`;
}

async function sendChat(){
 const t=$('ch-in').value.trim();if(!t||!S.mid)return toast('Выберите модель и введите текст!');
 const mode=$('ch-mode').value,br=$('ch-br').value,temp=+$('ch-t').value||0.7,sp=$('ch-sp').value.trim();
 S.msgs.push({role:'user',content:t});renderChat();
 const {ok,data}=await api('/api/chat',{body:{modelRowId:S.mid,messages:S.msgs.map(m=>({role:m.role,content:m.content})),mode,brainLevel:br,memoryFacts:S.mem,secretPrompt:sp,temperature:temp}});

 let txt=String(data.text||'').replace(/\/\/SAVE:\s*(.+)/gi,(_,f)=>{f=f.trim();if(f&&!S.mem.includes(f))S.mem.push(f);return''}).trim();

 localStorage.setItem('nx_msgs',JSON.stringify(S.msgs));renderChat();
}
