<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ASD AI — Нейросети и Маркетплейс API</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root {
  --bg: #141416;
  --s1: #1e1e22;
  --s2: #28282e;
  --s3: #34343c;
  --b: #33333b;
  --t: #f2f2f5;
  --m: #9a9aa6;
  --red: #ff2828;
  --g: #10b981;
  --r: #ef4444;
  --y: #fbbf24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: #3d3d46; border-radius: 99px; }

@keyframes spinCrown {
  0% { transform: translateY(0) rotateY(0deg) rotateZ(-8deg); }
  50% { transform: translateY(-4px) rotateY(180deg) rotateZ(8deg); }
  100% { transform: translateY(0) rotateY(360deg) rotateZ(-8deg); }
}
@keyframes pulseRed {
  0%, 100% { text-shadow: 0 0 14px rgba(255, 40, 40, 0.55); }
  50% { text-shadow: 0 0 26px rgba(255, 40, 40, 0.95); }
}

body {
  font: 14px/1.5 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--t);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}
h2, h3, h4 { font-weight: 700; line-height: 1.3; }
code, pre, .mono { font-family: 'JetBrains Mono', monospace; }
a { color: #60a5fa; cursor: pointer; text-decoration: none; }

/* Загрузочный экран ASD с крутящейся коронкой на голове */
#asd-loader {
  position: fixed;
  inset: 0;
  background: #101012;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  transition: opacity 0.4s ease;
}
#asd-loader.hide { opacity: 0; pointer-events: none; }

.asd-brand {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
  cursor: pointer;
}
.asd-crown {
  color: var(--y);
  font-size: 20px;
  line-height: 1;
  margin-bottom: -5px;
  filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.65));
  display: inline-block;
  transform-origin: center;
}
.asd-CrownSpin .asd-crown,
#asd-loader .asd-crown {
  animation: spinCrown 1.1s infinite ease-in-out;
}
.asd-letters {
  font-weight: 900;
  font-size: 24px;
  letter-spacing: 1px;
  color: var(--red);
  line-height: 1;
  animation: pulseRed 2.5s infinite;
}
#asd-loader .asd-crown { font-size: 46px; margin-bottom: -10px; }
#asd-loader .asd-letters { font-size: 58px; letter-spacing: 3px; }

button, input, select, textarea {
  font: inherit;
  color: var(--t);
  background: var(--s2);
  border: 1px solid var(--b);
  border-radius: 10px;
  padding: 9px 12px;
  outline: none;
  transition: 0.15s;
  max-width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: #777; background: #24242a; }
button {
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
}
button:hover { background: var(--s3); }
button:active { transform: scale(0.98); }

.btn { background: #ffffff; color: #111111; border: none; font-weight: 700; }
.btn:hover { background: #e4e4e7; color: #111111; }
.btn-g { background: rgba(16, 185, 129, 0.16); color: #34d399; border-color: rgba(16, 185, 129, 0.45); }
.btn-r { background: rgba(239, 68, 68, 0.16); color: #f87171; border-color: rgba(239, 68, 68, 0.45); }
.btn-y { background: linear-gradient(135deg, #fbbf24, #d97706); color: #111; border: none; font-weight: 700; }
.sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
.mut { font-size: 12px; color: var(--m); line-height: 1.45; }
.w1 { width: 100%; }
.hd { display: none !important; }
.lbl { font-size: 11px; font-weight: 700; color: var(--m); margin-bottom: 4px; display: block; text-transform: uppercase; }

.top {
  height: 60px;
  background: var(--bg);
  border-bottom: 1px solid var(--b);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  gap: 8px;
  position: sticky;
  top: 0;
  z-index: 40;
  flex-wrap: nowrap;
}
.wrap { display: flex; flex: 1; min-height: 0; }
.side-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 85; display: none; }
.side-bg.on { display: block; }
.side {
  width: 270px;
  background: var(--s1);
  border-right: 1px solid var(--b);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex-shrink: 0;
}
.nav { background: transparent; border: none; justify-content: flex-start; padding: 10px 12px; border-radius: 10px; color: var(--m); font-weight: 500; width: 100%; }
.nav i { font-size: 18px; }
.nav:hover, .nav.act { background: var(--s2); color: var(--t); }
.nav.act { font-weight: 700; border-left: 3px solid var(--red); }

.acc-btn { margin-top: auto; background: var(--s2); border: 1px solid var(--b); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; width: 100%; }
.ava { width: 36px; height: 36px; border-radius: 50%; background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; flex-shrink: 0; }

.main { flex: 1; padding: 16px; overflow-y: auto; max-width: 1120px; width: 100%; margin: 0 auto; }
.card { background: var(--s1); border: 1px solid var(--b); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.plan-card { background: var(--s1); border: 1px solid var(--b); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
.plan-card.pop { border: 2px solid var(--g); background: linear-gradient(180deg, rgba(16,185,129,0.09), var(--s1) 42%); }
.plan-card.vip { border: 2px solid var(--y); background: linear-gradient(180deg, rgba(245,158,11,0.09), var(--s1) 42%); }
.price-big { font-size: 28px; font-weight: 800; color: #fff; }
.feat-list { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #dadade; }
.feat-list div { display: flex; align-items: center; gap: 8px; }
.feat-list i { color: var(--g); font-size: 16px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sp { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 10px; }
.tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--s2); border: 1px solid var(--b); color: var(--m); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.tag.g { color: #34d399; border-color: rgba(16,185,129,0.4); background: rgba(16,185,129,0.1); }
.tag.r { color: #f87171; border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.1); }
.tag.y { color: #fbbf24; border-color: rgba(245,158,11,0.4); background: rgba(245,158,11,0.1); }

.msgs { height: 52vh; min-height: 270px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 6px 0; }
.msg { max-width: 88%; padding: 12px 15px; border-radius: 14px; background: var(--s1); border: 1px solid var(--b); white-space: pre-wrap; word-break: break-word; }
.msg.u { align-self: flex-end; background: #2d2d35; border-color: #454552; }
.msg pre { background: #101014; border: 1px solid var(--b); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 6px 0; font-size: 12px; white-space: pre; }
.rp-act { color: #fbbf24; font-style: italic; background: rgba(245,158,11,0.1); padding: 1px 5px; border-radius: 4px; }
.think { background: var(--s2); border-left: 3px solid var(--y); padding: 8px 10px; margin-bottom: 8px; font-size: 12px; color: var(--m); border-radius: 6px; }
.bar { height: 7px; background: var(--s2); border-radius: 99px; overflow: hidden; margin: 4px 0; }
.bar > i { display: block; height: 100%; background: var(--g); border-radius: 99px; }

.mod, .ban { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 14px; z-index: 100; background: rgba(0,0,0,0.78); }
.mod.on, .ban.on { display: flex; }
.mod-in { background: var(--s1); border: 1px solid #444; border-radius: 16px; padding: 20px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; }
.ban { background: rgba(35,6,6,0.94); color: #fecaca; z-index: 110; text-align: center; flex-direction: column; }
.toast { position: fixed; bottom: 18px; right: 18px; left: 18px; max-width: 380px; margin: 0 auto; background: #26262c; border: 1px solid #555; padding: 11px 15px; border-radius: 10px; z-index: 105; display: none; }
.toast.on { display: flex; align-items: center; gap: 8px; }
.ad { background: var(--s1); border: 1px solid var(--b); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
iframe.sbx { width: 100%; height: 65vh; border: none; background: #fff; border-radius: 10px; }
.mob-btn { display: none; }
@media (max-width: 860px) { .desk-only { display: none !important; } .side { position: fixed; left: -280px; top: 0; bottom: 0; z-index: 90; transition: 0.2s; } .side.on { left: 0; } .mob-btn { display: inline-flex; } .msg { max-width: 96%; } }
</style>
</head>
<body>
<!-- Загрузочный экран с красным ASD и крутящейся коронкой на голове -->
<div id="asd-loader">
  <div class="asd-brand">
    <i class="ri-vip-crown-fill asd-crown"></i>
    <div class="asd-letters">ASD</div>
  </div>
  <div class="mut">Загрузка нейросети ASD AI...</div>
</div>

<div id="side-bg" class="side-bg" onclick="toggleMenu(false)"></div>
<header class="top">
  <div class="row" style="flex-wrap:nowrap;gap:12px">
    <button class="mob-btn sm" onclick="toggleMenu(true)"><i class="ri-menu-line"></i></button>
    <div id="top-logo" class="asd-brand asd-CrownSpin" onclick="spinLogo(1200);go('chat')" title="ASD AI">
      <i class="ri-vip-crown-fill asd-crown"></i>
      <div class="asd-letters">ASD</div>
    </div>
  </div>
  <div id="stats-bar" class="row mut desk-only"></div>
  <div class="row" style="flex-wrap:nowrap">
    <button class="sm btn-g" onclick="go('keys')"><i class="ri-add-circle-fill"></i>Добавить AI (API)</button>
    <button class="sm btn-y" onclick="go('bill')"><i class="ri-vip-crown-fill"></i>PRO 500₽ / ULTRA 1499₽</button>
  </div>
</header>

<div class="wrap">
  <aside id="side" class="side">
    <div class="row sp mob-btn" style="padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--b)">
      <div class="asd-brand"><i class="ri-vip-crown-fill asd-crown" style="font-size:15px"></i><div class="asd-letters" style="font-size:18px">ASD</div></div>
      <button class="sm" onclick="toggleMenu(false)">✕</button>
    </div>
    <button class="btn-g w1" style="margin-bottom:6px;padding:10px" onclick="go('keys')"><i class="ri-add-box-fill"></i>+ Выложить свой AI (API)</button>
    <button class="nav act" data-t="chat" onclick="go('chat')"><i class="ri-chat-3-line"></i>1. Чат и Ролеплей (ИИ)</button>
    <button class="nav" data-t="cat" onclick="go('cat')"><i class="ri-compass-3-line"></i>2. Выбрать нейросеть</button>
    <button class="nav" data-t="bill" onclick="go('bill')"><i class="ri-vip-diamond-line" style="color:var(--y)"></i>3. Купить PRO / ULTRA <span class="tag y" style="margin-left:auto">50/50</span></button>
    <button class="nav" data-t="keys" onclick="go('keys')"><i class="ri-key-2-line"></i>4. Мои API и Заработок</button>
    <button class="nav" data-t="sbx" onclick="go('sbx')"><i class="ri-code-box-line"></i>5. HTML Песочница</button>
    <button class="nav" id="nav-adm" data-t="adm" onclick="go('adm')"><i class="ri-shield-star-line"></i>6. Админка (Создатель)</button>

    <div id="acc-box" class="acc-btn" onclick="openAccountModal()">
      <div class="ava" id="acc-ava">A</div>
      <div style="flex:1;min-width:0">
        <div class="row sp" style="gap:4px"><b id="acc-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Профиль</b><span class="tag g" id="acc-plan">FREE</span></div>
        <div class="mut" id="acc-mail" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Промокод и Gmail</div>
      </div>
      <i class="ri-more-2-fill mut"></i>
    </div>
  </aside>
  <main class="main">
    <div id="ad-box" class="ad hd"></div>
    <div id="creator-bar" class="hd"></div>
    <div id="view"></div>
  </main>
</div>
<div id="mod" class="mod" onclick="if(event.target===this)closeMod()"><div id="mod-in" class="mod-in"></div></div>
<div id="ban" class="ban"></div>
<div id="toast" class="toast"></div>

<script>
const API = 'https://omni-api.aegertcool.workers.dev';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

window.S = {
  tok: localStorage.getItem('nx_tok') || localStorage.getItem('token') || '',
  user: JSON.parse(localStorage.getItem('nx_user_cache') || 'null'),
  ad: null, cap: null, needCode: false, authMode: 'login',
  cat: [], mid: +localStorage.getItem('nx_mid') || 0,
  msgs: JSON.parse(localStorage.getItem('nx_msgs') || '[]'),
  mem: JSON.parse(localStorage.getItem('nx_mem') || '[]'),
  tab: 'chat', cStep: 0, sbx: [], payInfo: {}, slashPreset: 'rp'
};

function spinLogo(ms = 900) {
  const lg = $('top-logo');
  if (!lg) return;
  lg.classList.add('asd-CrownSpin');
  clearTimeout(window._spT);
  window._spT = setTimeout(() => lg.classList.remove('asd-CrownSpin'), ms);
}

setTimeout(() => { if ($('asd-loader')) $('asd-loader').classList.add('hide'); spinLogo(1000); }, 1100);

function toggleMenu(on) { $('side').classList.toggle('on', on); $('side-bg').classList.toggle('on', on); }

function resetDevIds() {
  const d = 'd_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  const h = 'hw_' + Math.random().toString(16).slice(2) + Date.now().toString(16);
  localStorage.setItem('nx_dev_v5', d); localStorage.setItem('nx_hw_v5', h);
  return { d, h };
}
function getDev() {
  let d = localStorage.getItem('nx_dev_v5'), h = localStorage.getItem('nx_hw_v5');
  return (!d || !h) ? resetDevIds() : { d, h };
}
function toast(m) {
  const t = $('toast');
  t.innerHTML = `<i class="ri-checkbox-circle-fill" style="color:var(--g)"></i><span>${esc(m)}</span>`;
  t.classList.add('on'); clearTimeout(window._tT);
  window._tT = setTimeout(() => t.classList.remove('on'), 3500);
}
function openMod(h) { $('mod-in').innerHTML = h; $('mod').classList.add('on'); }
function closeMod() { $('mod').classList.remove('on'); }

async function api(p, o = {}, retried = false) {
  spinLogo(800);
  try {
    const { d, h } = getDev();
    const r = await fetch(API + p, {
      method: o.method || (o.body ? 'POST' : 'GET'),
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + S.tok, 'X-Device-Id': d, 'X-Hw-Hash': h },
      body: o.body ? JSON.stringify(o.body) : undefined
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 403 && data.errorCode === 'DEVICE_BANNED') {
      if (!retried) { resetDevIds(); return api(p, o, true); }
      if (!sessionStorage.getItem('hide_ban')) showBan(data.reasons);
      return { status: 403, ok: false, data };
    }
    return { status: r.status, ok: r.ok && data.ok !== false, data };
  } catch (e) {
    return { status: 0, ok: false, data: { error: 'Ошибка соединения' } };
  }
}
</script>
<script>
const SLASH_PROMPTS = {
  rp: '// Отвечай как в Character.AI: описывай действия, мимику и эмоции в звёздочках *вот так*, говори от первого лица и активно продвигай сюжет вперёд! //',
  dev: '// Думай как создатель проекта и Senior-разработчик: перепроверь каждую строчку кода на баги и логику, пиши полный рабочий код! //',
  logic: '// Включи глубокое мышление: разбери задачу по шагам, перепроверь каждый вывод и дай точный ответ! //',
  free: '// Отвечай чётко, умно и по делу, запоминай важные факты тегом //SAVE: факт //'
};

function showBan(rs) {
  const b = $('ban'); b.classList.add('on');
  b.innerHTML = `<div class="card col" style="max-width:460px;background:#1f0707;border-color:var(--r)">
    <div class="row sp"><b>⚠️⚠️ ВЫ ЗАБАНЕНЫ ПО ЭТОЙ ПРИЧИНЕ ⚠️⚠️</b><button class="sm" onclick="sessionStorage.setItem('hide_ban','1');$('ban').classList.remove('on')">✕</button></div>
    <p>${esc(Array.isArray(rs) ? rs.join(', ') : (rs || 'Нарушение правил'))}</p>
    <input id="ban-u" class="w1" placeholder="Ваш никнейм" value="${esc(S.user?.username || '')}">
    <textarea id="ban-m" class="w1" rows="2" placeholder="Обжалование..."></textarea>
    <button class="btn w1" onclick="sendAppeal()">Отправить обжалование</button>
    <button class="btn-g w1" onclick="resetDevIds();$('ban').classList.remove('on');location.reload()">⚡ Сбросить бан железа</button></div>`;
}

async function sendAppeal() {
  const { ok, data } = await api('/api/ban/appeal', { body: { username: $('ban-u').value, message: $('ban-m').value } });
  toast(ok ? 'Обжалование отправлено!' : (data.error || 'Ошибка'));
}

function renderCreatorBar() {
  const cb = $('creator-bar');
  const isCr = S.user && (S.user.isAdmin || String(S.user.username).toLowerCase() === 'asdcreator');
  cb.classList.toggle('hd', !isCr);
  if (!isCr) return;
  cb.innerHTML = `<div class="card row sp" style="border-color:var(--red);background:rgba(255,40,40,0.08);padding:10px 14px">
    <div class="row"><span class="tag r">👑 СОЗДАТЕЛЬ ASD (asdcreator)</span><span class="mut">Твои быстрые кнопки управления:</span></div>
    <div class="row">
      <button class="sm btn-y" onclick="go('adm')">👑 Выдать подписку челику</button>
      <button class="sm btn-g" onclick="go('keys')">➕ Выложить API</button>
      <button class="sm" onclick="openAccountModal()">🎟 Промокоды</button>
    </div></div>`;
}

function updateSidebarAccount() {
  renderCreatorBar();
  if (!S.tok || !S.user) {
    $('acc-ava').textContent = '→'; $('acc-name').textContent = 'Войти в аккаунт';
    $('acc-plan').textContent = 'Гость'; $('acc-mail').textContent = 'Нажмите для входа';
    return;
  }
  const u = S.user, l = u.limits || {};
  const left5h = Math.max(0, (l.cap5h || 0) - (l.used5h || 0));
  $('acc-ava').textContent = (u.username || 'A')[0].toUpperCase();
  $('acc-name').textContent = u.username;
  $('acc-plan').textContent = (u.plan || 'free').toUpperCase();
  $('acc-mail').textContent = (u.email || 'Gmail') + ` • Осталось: ${left5h} запр.`;
}

function openAccountModal() {
  if (!S.tok || !S.user) return go('auth');
  const u = S.user, l = u.limits || {}, w = u.wallet || {};
  const left5h = Math.max(0, (l.cap5h || 0) - (l.used5h || 0));
  const bar = (a, b) => `<div class="bar"><i style="width:${Math.min(100, ((a || 0) / (b || 1)) * 100)}%"></i></div>`;
  openMod(`<div class="col">
    <div class="row sp">
      <div class="row"><div class="ava" style="width:44px;height:44px">${esc((u.username || 'A')[0].toUpperCase())}</div>
        <div><h3>${esc(u.username)} <span class="tag g">${esc((u.plan || 'free').toUpperCase())}</span></h3><div class="mut">📧 Gmail: <b>${esc(u.email || 'не указан')}</b></div></div></div>
      <button class="sm" onclick="closeMod()">✕</button>
    </div>
    <div class="card col" style="margin:0;padding:12px;background:var(--s2);border-color:var(--y)">
      <span class="lbl" style="color:var(--y)">🎟 ВВЕСТИ ПРОМОКОД</span>
      <div class="row"><input id="mod-prm" placeholder="Введите промокод..." style="flex:1"><button class="btn sm" onclick="pAct('/api/promo/redeem',{code:$('mod-prm').value});closeMod()">Активировать</button></div>
    </div>
    <div class="card col" style="margin:0;padding:12px">

async function selectModelForChat(id) {

  if (r.ok) S.cat = r.data.models || [];

      $('ad-box').innerHTML = `<div><b>${esc(data.ad.title)}</b> <span class="mut">${esc(data.ad.text)}</span></div>` + (data.ad.url ? `<a class="btn sm" target="_blank" href="${esc(data.ad.url)}">Открыть</a>` : '');

async function loadMe() {
  updateSidebarAccount();
  if (!S.tok) return go(['cat', 'adm', 'sbx', 'bill'].includes(S.tab) ? S.tab : 'auth');
  const { status, ok, data } = await api('/api/auth/me');
  if (status === 401) {
    S.tok = ''; S.user = null; localStorage.removeItem('nx_tok'); localStorage.removeItem('nx_user_cache');
    updateSidebarAccount(); return go('auth');
  }
  if (ok && data.user) {
    S.user = data.user; localStorage.setItem('nx_user_cache', JSON.stringify(S.user)); updateSidebarAccount();
    for (const dv of (S.user.devices || [])) { if (!dv.is_trusted && !dv.trusted) api('/api/devices/trust', { body: { deviceRowId: dv.id } }); }
  }
  go(S.tab === 'auth' ? 'chat' : S.tab);
}

function logout() { S.tok = ''; S.user = null; localStorage.removeItem('nx_tok'); localStorage.removeItem('nx_user_cache'); updateSidebarAccount(); go('auth'); }

function go(t) {
  toggleMenu(false);
  if (!S.tok && !['auth', 'cat', 'adm', 'sbx', 'bill'].includes(t)) t = 'auth';
  S.tab = t;
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('act', n.dataset.t === t));
  if (t === 'auth') renderAuth();
  else if (t === 'chat') renderChat();
  else if (t === 'cat') renderCat();
  else if (t === 'sbx') renderSbxPage();
  else if (t === 'keys') renderKeys();
  else if (t === 'bill') renderBill();
  else if (t === 'adm') renderAdm();
}

function fmtMsg(m, i) {
  let h = esc(m.content || '');
  if (m.thinking) h = `<details class="think"><summary>🧠 Мышление ИИ</summary><div style="margin-top:4px">${esc(m.thinking)}</div></details>` + h;
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => {
    const isH = l.toLowerCase() === 'html' || c.includes('<html') || c.includes('<!DOCTYPE') || c.includes('<body');
    S.sbx[i] = c;
    return `<pre>${c}</pre>` + (isH ? `<button class="sm btn-g" onclick="runSbx(${i})">▶ Запустить HTML в песочнице</button>` : '');
  });
  h = h.replace(/\*([^*\n]+)\*/g, '<span class="rp-act">*$1*</span>');
  return `<div class="msg ${m.role === 'user' ? 'u' : ''}"><div>${h}</div>${m.meta ? `<div class="mut" style="margin-top:6px">${esc(m.meta)}</div>` : ''}</div>`;
}

function runSbx(i) {
  const d = (S.sbx[i] || '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'");

async function sendChat() {
  const t = $('ch-in').value.trim();
  const selMod = $('ch-m')?.value || S.mid;
  if (!t || !selMod || selMod === '0') return toast('Сначала выберите нейросеть сверху и введите текст!');
  S.mid = selMod;
  const mode = $('ch-mode').value, br = $('ch-br').value, temp = +$('ch-t').value || 0.8, sp = $('ch-sp').value.trim();

  msgsForApi.push({ role: 'user', content: t + (sp ? '\n' + sp : '') + brTag });

  S.msgs.push({ role: 'user', content: t });
  renderChat();
  const { ok, data } = await api('/api/chat', {
    body: { modelRowId: S.mid, messages: msgsForApi, mode, brainLevel: br, memoryFacts: S.mem, secretPrompt: (sp ? sp + ' ' : '') + brTag, temperature: temp }

}

      <button class="sm" onclick="keyAct(${k.id},'ping')">Пинг</button>

    body: { provider: $('k-p').value, apiKey: $('k-k').value.trim(), title: $('k-t').value.trim(), description: $('k-d').value.trim(), isPrivate: $('k-pr').checked, isUncensored: $('k-un').checked, isFree: $('k-fr').checked, tierRequired: $('k-tr').value, dailyCapRub: +$('k-c').value || 470 }
  });
  toast(ok ? 'API-ключ выложен! Открываем каталог...' : (data.error || 'Ошибка'));
  if (ok) go('cat');
}

async function keyAct(id, a) { await api(`/api/keys/${id}${a === 'del' ? '' : '/' + a}`, { method: a === 'del' ? 'DELETE' : 'POST' }); renderKeys(); }
async function pAct(p, b) { const { ok, data } = await api(p, { body: b }); toast(ok ? 'Выполнено!' : (data.error || 'Ошибка')); loadMe(); }

async function renderBill() {
  const { data } = await api('/api/billing/info'); S.payInfo = data || {}; S.cStep = 0;
  $('view').innerHTML = `<div class="col">
    <div style="text-align:center"><h2>Подписки ASD AI (50% дохода идёт авторам API!)</h2></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(270px,1fr))">
      <div class="plan-card pop"><div class="col"><div class="row sp"><h3>🔥 PRO</h3><span class="tag g">500 ₽ (250₽ разрабу)</span></div><div class="price-big">500 ₽ <span class="mut" style="font-size:13px">/ 30 дн.</span></div>
        <div class="feat-list"><div><i class="ri-checkbox-circle-fill"></i>Доступ к PRO API-ключам (лимит до 470 ₽)</div><div><i class="ri-checkbox-circle-fill"></i>Character.AI Ролеплей со *звёздочками*</div><div><i class="ri-checkbox-circle-fill"></i>Режим проверки каждой строки кода</div></div></div>
        <button class="btn-g w1" style="padding:12px" onclick="openPayModal('buy_pro','Подписка PRO','500 ₽')">🚀 Купить PRO за 500 ₽</button></div>
      <div class="plan-card vip"><div class="col"><div class="row sp"><h3>💎 ULTRA</h3><span class="tag y">VIP МАКСИМУМ</span></div><div class="price-big">1499 ₽ <span class="mut" style="font-size:13px">/ 30 дн.</span></div>
        <div class="feat-list"><div><i class="ri-checkbox-circle-fill" style="color:var(--y)"></i>Все закрытые ULTRA + PRO нейросети</div><div><i class="ri-checkbox-circle-fill" style="color:var(--y)"></i>♾️ Вечная память + Мышление Гений</div></div></div>
        <button class="btn-y w1" style="padding:12px" onclick="openPayModal('buy_ultra','Подписка ULTRA','1499 ₽')">👑 Купить ULTRA за 1499 ₽</button></div>
    </div>
    <div class="card row sp" style="border-color:var(--g)"><div><h3>⚡ Сбросить 5-часовой лимит запросов</h3><p class="mut">Мгновенное обнуление таймера (250 ₽ для PRO/ULTRA, 500 ₽ для FREE)</p></div><button class="btn" onclick="openPayModal('reset_5h','Сброс 5ч','250 / 500 ₽')">⚡ Сбросить 5ч</button></div></div>`;
}

function openPayModal(type, title, price) {
  const ph = S.payInfo.phone || 'Уточните в админке', bk = S.payInfo.bank || 'Сбербанк';
  openMod(`<div class="col"><div class="row sp"><h3>${esc(title)} — ${esc(price)}</h3><button class="sm" onclick="closeMod()">✕</button></div>
    <div class="card row sp" style="margin:0;background:var(--s2)"><div><span class="lbl">${esc(bk)}</span><b class="mono" style="font-size:16px">${esc(ph)}</b></div><button class="sm btn" onclick="navigator.clipboard.writeText('${esc(ph)}');toast('Скопировано!')">📋 Копировать</button></div>
    <input id="bl-n" placeholder="Ваш логин" value="${esc(S.user?.username || '')}"><input id="bl-s" placeholder="Имя отправителя и сумма (${esc(price)})">
    <button class="btn-g w1" style="padding:12px" onclick="ordB('${type}')">✅ Я перевёл — Получить подписку</button></div>`);
}

async function ordB(t) { const { ok, data } = await api('/api/billing/order', { body: { itemType: t, customNick: $('bl-n').value, senderNote: $('bl-s').value } }); if (ok) closeMod(); toast(ok ? 'Заявка отправлена!' : (data.error || 'Ошибка')); }
async function adm(p, b, m = 'POST') { const r = await api('/api/admin/' + p, { method: m, body: b }); toast(r.ok ? '✅ Выполнено успешно!' : (r.data.error || 'Ошибка сервера')); if (r.ok) renderAdm(); }

async function givePlanByNick(plan) {
  const uid = $('adm-uid').value;
  const days = +$('adm-days').value || 30;
  if (!uid) return toast('Выберите челика из списка!');
  await adm('user-plan', { targetUserId: +uid, plan: plan.toLowerCase(), days });
}

async function renderAdm() {
  const { ok, data } = await api('/api/admin/overview'); const d = data || {}, pc = d.payConfig || {}, users = d.users || [];
  $('view').innerHTML = `<div class="card col" style="border-color:var(--y)">
    <h3>👑 Быстро выдать подписку челику</h3>
    <div class="row">
      <select id="adm-uid" style="flex:2;min-width:180px">
        ${users.map(u => `<option value="${u.id}">👤 ${esc(u.username)} (сейчас: ${esc(u.plan || 'free')}, ID: ${u.id})</option>`).join('') || '<option value="">Нет юзеров</option>'}
      </select>
      <input id="adm-days" type="number" value="30" style="width:80px" title="Дней">
      <button class="btn-g sm" onclick="givePlanByNick('pro')">🔥 Выдать PRO</button>
      <button class="btn-y sm" onclick="givePlanByNick('ultra')">💎 Выдать ULTRA</button>
      <button class="sm" onclick="givePlanByNick('free')">Сбросить на FREE</button>
    </div>
  </div>
  <div class="grid">
    <div class="card col"><h4>📦 Заявки на оплату (${(d.orders || []).length})</h4>${(d.orders || []).map(o => `<div class="row sp mut"><span><b>${esc(o.custom_nick || o.username)}</b>: ${esc(o.item_type)}</span><div class="row"><button class="sm btn-g" onclick="adm('order-resolve',{orderId:${o.id},approve:true})">Выдать</button><button class="sm btn-r" onclick="adm('order-resolve',{orderId:${o.id},approve:false})">✕</button></div></div>`).join('') || '<span class="mut">Заявок пока нет</span>'}</div>
    <div class="card col"><h4>🎟 Создать промокод</h4><div class="row"><input id="pr-c" placeholder="Код" style="flex:1"><select id="pr-p"><option value="pro">PRO</option><option value="ultra">ULTRA</option></select><input id="pr-d" value="30" style="width:55px"><button class="sm btn" onclick="adm('promo',{code:$('pr-c').value,plan:$('pr-p').value,days:+$('pr-d').value})">+</button></div>${(d.promos || []).map(p => `<div class="row sp mut"><span><b>${esc(p.code)}</b> (${esc(p.plan)})</span><button class="sm btn-r" onclick="adm('promo/'+encodeURIComponent('${esc(p.code)}'),null,'DELETE')">✕</button></div>`).join('')}</div>
    <div class="card col"><h4>🏦 Сбербанк и ТГ</h4><input id="ap-p" placeholder="Телефон Сбера" value="${esc(pc.phone || '')}"><input id="ap-b" placeholder="Банк" value="${esc(pc.bank || 'Сбербанк')}"><input id="ap-t" placeholder="TG Token" value="${esc(pc.tgToken || '')}"><input id="ap-c" placeholder="TG Chat ID" value="${esc(pc.tgChatId || '')}"><button class="btn sm" onclick="adm('pay-config',{phone:$('ap-p').value,bank:$('ap-b').value,tgToken:$('ap-t').value,tgChatId:$('ap-c').value})">Сохранить</button></div>
    <div class="card col"><h4>👥 Все пользователи (${users.length})</h4>${users.map(u => `<div class="row sp mut"><span><b>${esc(u.username)}</b> [${esc(u.plan)}]</span><div class="row"><button class="sm btn-g" onclick="adm('user-plan',{targetUserId:${u.id},plan:'pro',days:30})">+PRO</button><button class="sm btn-y" onclick="adm('user-plan',{targetUserId:${u.id},plan:'ultra',days:30})">+ULTRA</button><button class="sm btn-r" onclick="adm('user-ban',{targetUserId:${u.id},ban:${!u.is_banned}})">${u.is_banned ? 'Разбан' : 'Бан'}</button></div></div>`).join('')}</div>
  </div>`;
}

loadStats(); loadMe();
</script>
</body>
</html>
