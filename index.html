<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NEXUS AI — Studio & API Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root{--bg:#161618;--s1:#202024;--s2:#2a2a30;--s3:#35353d;--b:#34343c;--t:#f0f0f4;--m:#9a9aa6;--g:#10b981;--r:#ef4444;--y:#f59e0b;--bl:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#3d3d46;border-radius:99px}
body{font:14px/1.5 'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
h2,h3,h4{font-weight:700;line-height:1.3}code,pre,.mono{font-family:'JetBrains Mono',monospace}
a{color:var(--bl);cursor:pointer;text-decoration:none}
button,input,select,textarea{font:inherit;color:var(--t);background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:9px 12px;outline:none;transition:.15s;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:#777;background:#25252b}
button{cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button:hover{background:var(--s3)}button:active{transform:scale(.98)}
.btn{background:#fff;color:#111;border:none;font-weight:700}.btn:hover{background:#e4e4e7;color:#111}
.btn-g{background:rgba(16,185,129,.16);color:#34d399;border-color:rgba(16,185,129,.45)}
.btn-r{background:rgba(239,68,68,.16);color:#f87171;border-color:rgba(239,68,68,.45)}
.btn-y{background:linear-gradient(135deg,#f59e0b,#d97706);color:#111;border:none;font-weight:700}
.sm{padding:6px 10px;font-size:12px;border-radius:8px}.mut{font-size:12px;color:var(--m);line-height:1.45}.w1{width:100%}.hd{display:none!important}
.lbl{font-size:11px;font-weight:700;color:var(--m);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.4px}
.top{height:56px;background:var(--bg);border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:8px;position:sticky;top:0;z-index:40;flex-wrap:nowrap}
.logo{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.wrap{display:flex;flex:1;min-height:0}.side-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:85;display:none}.side-bg.on{display:block}
.side{width:270px;background:var(--s1);border-right:1px solid var(--b);padding:12px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.nav{background:transparent;border:none;justify-content:flex-start;padding:10px 12px;border-radius:10px;color:var(--m);font-weight:500;width:100%}
.nav i{font-size:18px}.nav:hover,.nav.act{background:var(--s2);color:var(--t)}.nav.act{font-weight:700}
.acc-btn{margin-top:auto;background:var(--s2);border:1px solid var(--b);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;width:100%}
.acc-btn:hover{background:var(--s3);border-color:#666}
.ava{width:36px;height:36px;border-radius:50%;background:#3b3b44;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.main{flex:1;padding:16px;overflow-y:auto;max-width:1120px;width:100%;margin:0 auto}
.card{background:var(--s1);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:12px}
.plan-card{background:var(--s1);border:1px solid var(--b);border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.plan-card.pop{border:2px solid var(--g);background:linear-gradient(180deg,rgba(16,185,129,.09),var(--s1) 42%)}
.plan-card.vip{border:2px solid var(--y);background:linear-gradient(180deg,rgba(245,158,11,.09),var(--s1) 42%)}
.price-big{font-size:28px;font-weight:800;color:#fff}
.feat-list{display:flex;flex-direction:column;gap:8px;font-size:13px;color:#dadade}.feat-list div{display:flex;align-items:center;gap:8px}.feat-list i{color:var(--g);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:10px}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--s2);border:1px solid var(--b);color:var(--m);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.g{color:#34d399;border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.1)}
.tag.r{color:#f87171;border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.1)}
.tag.y{color:#fbbf24;border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.1)}
.msgs{height:52vh;min-height:270px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 0}
.msg{max-width:88%;padding:12px 15px;border-radius:14px;background:var(--s1);border:1px solid var(--b);white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:#2d2d35;border-color:#454552}
.msg pre{background:#101014;border:1px solid var(--b);padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0;font-size:12px;white-space:pre}
.rp-act{color:#fbbf24;font-style:italic;background:rgba(245,158,11,.08);padding:1px 5px;border-radius:4px}
.think{background:var(--s2);border-left:3px solid var(--y);padding:8px 10px;margin-bottom:8px;font-size:12px;color:var(--m);border-radius:6px}
.bar{height:7px;background:var(--s2);border-radius:99px;overflow:hidden;margin:4px 0}.bar>i{display:block;height:100%;background:var(--g);border-radius:99px}
.mod,.ban{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:14px;z-index:100;background:rgba(0,0,0,.78)}
.mod.on,.ban.on{display:flex}.mod-in{background:var(--s1);border:1px solid #444;border-radius:16px;padding:20px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
.ban{background:rgba(35,6,6,.94);color:#fecaca;z-index:110;text-align:center;flex-direction:column}
.toast{position:fixed;bottom:18px;right:18px;left:18px;max-width:380px;margin:0 auto;background:#26262c;border:1px solid #555;padding:11px 15px;border-radius:10px;z-index:105;display:none}
.toast.on{display:flex;align-items:center;gap:8px}
.ad{background:var(--s1);border:1px solid var(--b);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
iframe.sbx{width:100%;height:65vh;border:none;background:#fff;border-radius:10px}.mob-btn{display:none}
@media(max-width:860px){.desk-only{display:none!important}.side{position:fixed;left:-280px;top:0;bottom:0;z-index:90;transition:.2s}.side.on{left:0}.mob-btn{display:inline-flex}.msg{max-width:96%}}
</style>
</head>
<body>
<div id="side-bg" class="side-bg" onclick="toggleMenu(false)"></div>
<header class="top">
  <div class="row" style="flex-wrap:nowrap">
    <button class="mob-btn sm" onclick="toggleMenu(true)"><i class="ri-menu-line"></i></button>
    <div class="logo"><i class="ri-openai-fill"></i><span>NEXUS AI</span></div>
  </div>
  <div id="stats-bar" class="row mut desk-only"></div>
  <div class="row" style="flex-wrap:nowrap">
    <button class="sm btn-g" onclick="go('keys')"><i class="ri-add-circle-fill"></i>Добавить AI (API)</button>
    <button class="sm btn-y" onclick="go('bill')"><i class="ri-vip-crown-fill"></i>PRO 500₽ / ULTRA 1499₽</button>
  </div>
</header>
<div class="wrap">
  <aside id="side" class="side">
    <div class="row sp mob-btn" style="padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--b)">
      <b>NEXUS AI</b><button class="sm" onclick="toggleMenu(false)">✕</button>
    </div>
    <button class="btn-g w1" style="margin-bottom:6px;padding:10px" onclick="go('keys')"><i class="ri-add-box-fill"></i>+ Добавить свой AI (API)</button>
    <button class="nav act" data-t="chat" onclick="go('chat')"><i class="ri-chat-3-line"></i>Чат и Ролеплей (RP)</button>
    <button class="nav" data-t="cat" onclick="go('cat')"><i class="ri-compass-3-line"></i>Каталог нейросетей</button>
    <button class="nav" data-t="bill" onclick="go('bill')"><i class="ri-vip-diamond-line" style="color:var(--y)"></i>Подписки PRO / ULTRA <span class="tag y" style="margin-left:auto">50/50</span></button>
    <button class="nav" data-t="keys" onclick="go('keys')"><i class="ri-key-2-line"></i>Мои API и Доход 50%</button>
    <button class="nav" data-t="sbx" onclick="go('sbx')"><i class="ri-code-box-line"></i>HTML Песочница</button>
    <button class="nav" id="nav-adm" data-t="adm" onclick="go('adm')"><i class="ri-shield-star-line"></i>Панель Создателя</button>
    <div id="acc-box" class="acc-btn" onclick="openAccountModal()">
      <div class="ava" id="acc-ava">U</div>
      <div style="flex:1;min-width:0">
        <div class="row sp" style="gap:4px"><b id="acc-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Профиль</b><span class="tag g" id="acc-plan">FREE</span></div>
        <div class="mut" id="acc-mail" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Открыть аккаунт</div>
      </div>
      <i class="ri-more-2-fill mut"></i>
    </div>
  </aside>
  <main class="main"><div id="ad-box" class="ad hd"></div><div id="creator-bar" class="hd"></div><div id="view"></div></main>
</div>
<div id="mod" class="mod" onclick="if(event.target===this)closeMod()"><div id="mod-in" class="mod-in"></div></div>
<div id="ban" class="ban"></div>
<div id="toast" class="toast"></div>
<script>
const API = 'https://omni-api.aegertcool.workers.dev';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

window.S = {
  tok: localStorage.getItem('nx_tok') || localStorage.getItem('token') || '',
  user: JSON.parse(localStorage.getItem('nx_user_cache') || 'null'),
  ad: null,
  cap: null,
  needCode: false,
  authMode: 'login',
  cat: [],
  mid: +localStorage.getItem('nx_mid') || 0,
  msgs: JSON.parse(localStorage.getItem('nx_msgs') || '[]'),
  mem: JSON.parse(localStorage.getItem('nx_mem') || '[]'),
  tab: 'chat',
  cStep: 0,
  sbx: [],
  payInfo: {},
  slashPreset: 'rp'
};

const SLASH_PROMPTS = {
  rp: '// Отвечай в стиле Character.AI: обязательно пиши физические действия, мимику, окружение и эмоции в звёздочках *вот так*, веди живой диалог от лица персонажа и активно двигай сюжет вперёд! //',
  dev: '// Думай как создатель проекта и Senior-разработчик: перед ответом перепроверь каждую строчку кода на баги, логику и синтаксис, пиши только 100% рабочий код без заглушек! //',
  logic: '// Включи глубокое пошаговое мышление: разбери задачу по косточкам, проверь каждый аргумент на ошибки и выдай максимально точный ответ! //',
  free: '// Отвечай максимально прямо, честно и без лишней воды, помогая пользователю решить задачу на 100%! //'
};

function toggleMenu(on) {
  $('side').classList.toggle('on', on);
  $('side-bg').classList.toggle('on', on);
}

function resetDevIds() {
  const d = 'd_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  const h = 'hw_' + Math.random().toString(16).slice(2) + Date.now().toString(16);
  localStorage.setItem('nx_dev_v5', d);
  localStorage.setItem('nx_hw_v5', h);
  return { d, h };
}

function getDev() {
  let d = localStorage.getItem('nx_dev_v5');
  let h = localStorage.getItem('nx_hw_v5');
  return (!d || !h) ? resetDevIds() : { d, h };
}

function toast(m) {
  const t = $('toast');
  t.innerHTML = `<i class="ri-checkbox-circle-fill" style="color:var(--g)"></i><span>${esc(m)}</span>`;
  t.classList.add('on');
  clearTimeout(window._tT);
  window._tT = setTimeout(() => t.classList.remove('on'), 3500);
}

function openMod(h) { $('mod-in').innerHTML = h; $('mod').classList.add('on'); }
function closeMod() { $('mod').classList.remove('on'); }

async function api(p, o = {}, retried = false) {
  try {
    const { d, h } = getDev();
    const r = await fetch(API + p, {
      method: o.method || (o.body ? 'POST' : 'GET'),
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + S.tok, 'X-Device-Id': d, 'X-Hw-Hash': h },
      body: o.body ? JSON.stringify(o.body) : undefined
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 403 && data.errorCode === 'DEVICE_BANNED') {
      if (!retried) { resetDevIds(); return api(p, o, true); }
      if (!sessionStorage.getItem('hide_ban')) showBan(data.reasons);
      return { status: 403, ok: false, data };
    }
    return { status: r.status, ok: r.ok && data.ok !== false, data };
  } catch (e) {
    return { status: 0, ok: false, data: { error: 'Ошибка соединения' } };
  }
}

function showBan(rs) {
  const b = $('ban'); b.classList.add('on');
  b.innerHTML = `<div class="card col" style="max-width:460px;background:#1f0707;border-color:var(--r)">
    <div class="row sp"><b>⚠️⚠️ ВЫ ЗАБАНЕНЫ ПО ЭТОЙ ПРИЧИНЕ ⚠️⚠️</b><button class="sm" onclick="sessionStorage.setItem('hide_ban','1');$('ban').classList.remove('on')">✕</button></div>
    <p>${esc(Array.isArray(rs) ? rs.join(', ') : (rs || 'Нарушение правил'))}</p>
    <input id="ban-u" class="w1" placeholder="Ваш никнейм" value="${esc(S.user?.username || '')}">
    <textarea id="ban-m" class="w1" rows="2" placeholder="Обжалование..."></textarea>
    <button class="btn w1" onclick="sendAppeal()">Отправить обжалование</button>
    <button class="btn-g w1" onclick="resetDevIds();$('ban').classList.remove('on');location.reload()">⚡ Сбросить отпечаток железа</button></div>`;
}

async function sendAppeal() {
  const { ok, data } = await api('/api/ban/appeal', { body: { username: $('ban-u').value, message: $('ban-m').value } });
  toast(ok ? 'Обжалование отправлено!' : (data.error || 'Ошибка'));
}

function renderCreatorBar() {
  const cb = $('creator-bar');
  const isCr = S.user && (S.user.isAdmin || String(S.user.username).toLowerCase() === 'asdcreator');
  cb.classList.toggle('hd', !isCr);
  if (!isCr) return;
  cb.innerHTML = `<div class="card row sp" style="border-color:var(--y);background:rgba(245,158,11,0.07);padding:10px 14px">
    <div class="row"><span class="tag y">👑 ПАНЕЛЬ СОЗДАТЕЛЯ (asdcreator)</span><span class="mut">Быстрые кнопки управления только для тебя:</span></div>
    <div class="row">
      <button class="sm btn-g" onclick="go('adm')">📦 Заказы и Админка</button>
      <button class="sm btn" onclick="go('keys')">🔑 Выложить API</button>
      <button class="sm" onclick="trustAllDevs()">✅ Доверять моему железу</button>
      <button class="sm" onclick="openAccountModal()">🎟 Промокоды</button>
    </div></div>`;
}

async function trustAllDevs() {
  for (const dv of (S.user?.devices || [])) await api('/api/devices/trust', { body: { deviceRowId: dv.id } });
  toast('Все ваши устройства подтверждены!'); loadMe();
}

function updateSidebarAccount() {
  renderCreatorBar();
  if (!S.tok || !S.user) {
    $('acc-ava').textContent = '→'; $('acc-name').textContent = 'Войти в аккаунт';
    $('acc-plan').textContent = 'Гость'; $('acc-mail').textContent = 'Нажмите для входа';
    return;
  }
  const u = S.user, l = u.limits || {};
  const left5h = Math.max(0, (l.cap5h || 0) - (l.used5h || 0));
  $('acc-ava').textContent = (u.username || 'U')[0].toUpperCase();
  $('acc-name').textContent = u.username;
  $('acc-plan').textContent = (u.plan || 'FREE').toUpperCase();
  $('acc-mail').textContent = (u.email || 'Gmail подтверждён') + ` • Осталось: ${left5h} запр.`;
}

function openAccountModal() {
  if (!S.tok || !S.user) return go('auth');
  const u = S.user, l = u.limits || {}, w = u.wallet || {};
  const left5h = Math.max(0, (l.cap5h || 0) - (l.used5h || 0));
  const leftFree = Math.max(0, (l.freeReqsLimit || 0) - (l.freeReqsUsed || 0));
  const bar = (a, b) => `<div class="bar"><i style="width:${Math.min(100, ((a || 0) / (b || 1)) * 100)}%"></i></div>`;
  openMod(`<div class="col">
    <div class="row sp">
      <div class="row"><div class="ava" style="width:44px;height:44px">${esc((u.username || 'U')[0].toUpperCase())}</div>
        <div><h3>${esc(u.username)} <span class="tag g">${esc(u.plan || 'FREE')}</span></h3><div class="mut">📧 Gmail: <b>${esc(u.email || 'не указан')}</b></div></div></div>
      <button class="sm" onclick="closeMod()">✕</button>
    </div>
    <div class="card col" style="margin:0;padding:12px;background:var(--s2);border-color:var(--y)">
      <span class="lbl" style="color:var(--y)">🎟 АКТИВИРОВАТЬ ПРОМОКОД</span>
      <div class="row"><input id="mod-prm" placeholder="Введите промокод..." style="flex:1"><button class="btn sm" onclick="pAct('/api/promo/redeem',{code:$('mod-prm').value});closeMod()">Применить</button></div>
    </div>
    <div class="card col" style="margin:0;padding:12px">
      <div class="row sp"><b>📊 Осталось запросов (5ч): <span style="color:var(--g)">${left5h}</span> (Free: ${leftFree})</b><span class="tag y">Макс. лимит: до 470 ₽</span></div>
      <div><span class="lbl">Использовано за 5ч: ${l.used5h || 0} из ${l.cap5h || 0}</span>${bar(l.used5h, l.cap5h)}</div>
      <div><span class="lbl">За неделю: ${l.usedWeek || 0} из ${l.capWeek || 0}</span>${bar(l.usedWeek, l.capWeek)}</div>
      <div><span class="lbl">За месяц: ${l.usedMonth || 0} из ${l.capMonth || 0}</span>${bar(l.usedMonth, l.capMonth)}</div>
      <div class="row sp"><button class="sm btn-g" onclick="pAct('/api/bonus/checkin',{});closeMod()">🎁 Ежедневный бонус (${u.checkinStreak || 0} дн.)</button><button class="sm btn-y" onclick="closeMod();go('bill')">⚡ Купить PRO 500₽ / ULTRA 1499₽</button></div>
    </div>
    <div class="card col" style="margin:0;padding:12px">
      <span class="lbl">💰 Доход 50/50 с ваших API-ключей: ${w.balanceRub || 0} ₽ (всего: ${w.totalEarnedRub || 0} ₽)</span>
      <div class="row"><input id="wd-d" placeholder="Номер карты / СБП (вывод от 300 ₽)" style="flex:1"><button class="sm btn" onclick="if((${w.balanceRub || 0})<300)return toast('Минимум 300 ₽!');pAct('/api/wallet/withdraw',{details:$('wd-d').value})">Вывести</button></div>
    </div>
    <button class="sm btn-r w1" onclick="closeMod();logout()">Выйти из аккаунта (${esc(u.username)})</button></div>`);
}
</script>
<script>
async function loadStats() {
  const { ok, data } = await api('/api/stats');
  if (ok) {
    $('stats-bar').innerHTML = `<span class="tag">👥 Юзеров: ${data.users || 0}</span><span class="tag">🤖 Моделей: ${data.models || 0}</span><span class="tag">⚡ Запросов: ${data.requests || 0}</span>`;
    if (data.ad?.enabled) {
      $('ad-box').classList.remove('hd');
      $('ad-box').innerHTML = `<div><b>${esc(data.ad.title)}</b> <span class="mut">${esc(data.ad.text)}</span></div>` + (data.ad.url ? `<a class="btn sm" target="_blank" href="${esc(data.ad.url)}">Перейти</a>` : '');
    }
  }
}

async function loadMe() {
  updateSidebarAccount();
  if (!S.tok) return go(['cat', 'adm', 'sbx', 'bill'].includes(S.tab) ? S.tab : 'auth');
  const { status, ok, data } = await api('/api/auth/me');
  if (status === 401) {
    S.tok = ''; S.user = null; localStorage.removeItem('nx_tok'); localStorage.removeItem('nx_user_cache');
    updateSidebarAccount(); return go('auth');
  }
  if (ok && data.user) {
    S.user = data.user; localStorage.setItem('nx_user_cache', JSON.stringify(S.user)); updateSidebarAccount();
    for (const dv of (S.user.devices || [])) { if (!dv.is_trusted && !dv.trusted) api('/api/devices/trust', { body: { deviceRowId: dv.id } }); }
  }
  go(S.tab === 'auth' ? 'chat' : S.tab);
}

function fmtMsg(m, i) {
  let h = esc(m.content || '');
  if (m.thinking) h = `<details class="think"><summary>🧠 Цепочка мышления ИИ</summary><div style="margin-top:4px">${esc(m.thinking)}</div></details>` + h;
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => {
    const isH = l.toLowerCase() === 'html' || c.includes('<html') || c.includes('<!DOCTYPE') || c.includes('<body');
    S.sbx[i] = c;
    return `<pre>${c}</pre>` + (isH ? `<button class="sm btn-g" onclick="runSbx(${i})">▶ Запустить HTML в песочнице</button>` : '');
  });
  h = h.replace(/\*([^*\n]+)\*/g, '<span class="rp-act">*$1*</span>');
  return `<div class="msg ${m.role === 'user' ? 'u' : ''}"><div>${h}</div>${m.meta ? `<div class="mut" style="margin-top:6px">${esc(m.meta)}</div>` : ''}</div>`;
}

function runSbx(i) {
  const d = (S.sbx[i] || '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  openMod(`<div class="row sp" style="margin-bottom:8px"><b>HTML Песочница</b><button class="sm" onclick="closeMod()">✕</button></div><iframe class="sbx" sandbox="allow-scripts"></iframe>`);

}

async function sendChat() {

  const brTag = ` // Уровень мышления: ${br} //`;

  msgsForApi.push({ role: 'user', content: t + (sp ? '\n' + sp : '') + brTag });

  S.msgs.push({ role: 'user', content: t });
  renderChat();
  const { ok, data } = await api('/api/chat', {
    body: { modelRowId: S.mid, messages: msgsForApi, mode, brainLevel: br, memoryFacts: S.mem, secretPrompt: fullSecret, temperature: temp }

}

          <div><i class="ri-checkbox-circle-fill" style="color:var(--y)"></i>Доступ к закрытым <b>ULTRA + PRO</b> API-ключам</div>
          <div><i class="ri-checkbox-circle-fill" style="color:var(--y)"></i><b>♾️ Вечная память</b> + уровень мышления <b>🔮 Гений</b></div>
          <div><i class="ri-checkbox-circle-fill" style="color:var(--y)"></i>Максимальный пул запросов и приоритет скорости</div>
        </div></div>
        <button class="btn-y w1" style="padding:12px" onclick="openPayModal('buy_ultra','Подписка ULTRA','1499 ₽')">👑 Купить ULTRA за 1499 ₽</button>
      </div>
    </div>
    <div class="card row sp" style="border-color:var(--g)"><div><h3>⚡ Мгновенный сброс 5-часового лимита</h3><p class="mut">Обнулите таймер запросов прямо сейчас (250 ₽ для PRO/ULTRA, 500 ₽ для FREE)</p></div><button class="btn" onclick="openPayModal('reset_5h','Сброс лимита 5ч','250 / 500 ₽')">⚡ Сбросить 5ч</button></div>
    <div class="row sp mut"><a onclick="openAccountModal()">🎟 Ввести промокод →</a><button class="sm btn-r" id="ca-b" onclick="canAuto()">Отменить автооплату (в 3 клика)</button></div></div>`;
}

function openPayModal(type, title, price) {
  const ph = S.payInfo.phone || 'Уточните в админке', bk = S.payInfo.bank || 'Сбербанк';
  openMod(`<div class="col"><div class="row sp"><h3>${esc(title)} — ${esc(price)}</h3><button class="sm" onclick="closeMod()">✕</button></div>
    <div class="card row sp" style="margin:0;background:var(--s2)"><div><span class="lbl">${esc(bk)}</span><b class="mono" style="font-size:16px">${esc(ph)}</b></div><button class="sm btn" onclick="navigator.clipboard.writeText('${esc(ph)}');toast('Скопировано!')">📋 Копировать</button></div>
    <input id="bl-n" placeholder="Ваш логин" value="${esc(S.user?.username || '')}"><input id="bl-s" placeholder="Имя отправителя и сумма (${esc(price)})">
    <button class="btn-g w1" style="padding:12px" onclick="ordB('${type}')">✅ Я перевёл — Получить подписку</button></div>`);
}

async function ordB(t) { const { ok, data } = await api('/api/billing/order', { body: { itemType: t, customNick: $('bl-n').value, senderNote: $('bl-s').value } }); if (ok) closeMod(); toast(ok ? 'Заявка отправлена!' : (data.error || 'Ошибка')); }
async function canAuto() { S.cStep++; if (S.cStep < 3) $('ca-b').textContent = `Подтвердите отмену (${S.cStep + 1}/3)`; else { await pAct('/api/billing/cancel-auto', {}); S.cStep = 0; } }
async function adm(p, b, m = 'POST') { const r = await api('/api/admin/' + p, { method: m, body: b }); toast(r.ok ? 'Сохранено!' : (r.data.error || 'Ошибка')); if (r.ok) renderAdm(); }

async function renderAdm() {
  const { ok, data } = await api('/api/admin/overview'); const d = data || {}, pc = d.payConfig || {}, ad = d.ad || {};
  $('view').innerHTML = `<div class="card row sp"><h3>👑 Панель Создателя (${esc(S.user?.username || 'asdcreator')})</h3><span class="tag ${ok ? 'g' : 'y'}">${ok ? '✅ ROOT Активен' : esc(d.error || 'Проверка')}</span></div>
  <div class="grid">
    <div class="card col"><h4>📦 Заявки на подписку (${(d.orders || []).length})</h4>${(d.orders || []).map(o => `<div class="row sp mut"><span><b>${esc(o.custom_nick || o.username)}</b>: ${esc(o.item_type)}</span><div class="row"><button class="sm btn-g" onclick="adm('order-resolve',{orderId:${o.id},approve:true})">Выдать</button><button class="sm btn-r" onclick="adm('order-resolve',{orderId:${o.id},approve:false})">✕</button></div></div>`).join('') || '<span class="mut">Пусто</span>'}</div>
    <div class="card col"><h4>🏦 Сбер и ТГ-бот</h4><input id="ap-p" placeholder="Телефон" value="${esc(pc.phone || '')}"><input id="ap-b" placeholder="Банк" value="${esc(pc.bank || 'Сбербанк')}"><input id="ap-t" placeholder="TG Token" value="${esc(pc.tgToken || '')}"><input id="ap-c" placeholder="TG Chat ID" value="${esc(pc.tgChatId || '')}"><button class="btn sm" onclick="adm('pay-config',{phone:$('ap-p').value,bank:$('ap-b').value,tgToken:$('ap-t').value,tgChatId:$('ap-c').value})">Сохранить</button></div>
    <div class="card col"><h4>🎟 Промокоды</h4><div class="row"><input id="pr-c" placeholder="Код" style="flex:1"><select id="pr-p"><option>PRO</option><option>ULTRA</option></select><input id="pr-d" value="30" style="width:55px"><button class="sm btn" onclick="adm('promo',{code:$('pr-c').value,plan:$('pr-p').value,days:+$('pr-d').value})">+</button></div>${(d.promos || []).map(p => `<div class="row sp mut"><span>${esc(p.code)} (${esc(p.plan)})</span><button class="sm btn-r" onclick="adm('promo/'+encodeURIComponent('${esc(p.code)}'),null,'DELETE')">✕</button></div>`).join('')}</div>
    <div class="card col"><h4>👥 Юзеры (${(d.users || []).length})</h4>${(d.users || []).map(u => `<div class="row sp mut"><span><b>${esc(u.username)}</b> [${esc(u.plan)}]</span><div class="row"><select id="up-${u.id}"><option>FREE</option><option>PRO</option><option>ULTRA</option></select><button class="sm btn-g" onclick="adm('user-plan',{targetUserId:${u.id},plan:$('up-${u.id}').value,days:30})">ОК</button><button class="sm btn-r" onclick="adm('user-ban',{targetUserId:${u.id},ban:${!u.is_banned}})">${u.is_banned ? 'Разбан' : 'Бан'}</button></div></div>`).join('')}</div>
  </div>`;
}
loadStats(); loadMe();
</script>
</body>
</html>
