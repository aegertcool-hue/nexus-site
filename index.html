<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NEXUS AI — Arena & Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root {
  --bg: #171717;
  --s1: #212121;
  --s2: #2a2a2a;
  --s3: #343434;
  --b: #333333;
  --t: #ececec;
  --m: #9b9b9b;
  --g: #10b981;
  --r: #ef4444;
  --y: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 99px; }

body {
  font: 14px/1.5 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--t);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}
h2, h3, h4 { font-weight: 700; line-height: 1.3; }
code, pre, .mono { font-family: 'JetBrains Mono', monospace; }
a { color: #60a5fa; cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }

button, input, select, textarea {
  font: inherit;
  color: var(--t);
  background: var(--s2);
  border: 1px solid var(--b);
  border-radius: 10px;
  padding: 9px 12px;
  outline: none;
  transition: 0.15s ease;
  max-width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: #666; background: #262626; }
button {
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
}
button:hover { background: var(--s3); }
button:active { transform: scale(0.98); }

.btn { background: #ffffff; color: #111111; border: none; font-weight: 700; }
.btn:hover { background: #e5e5e5; color: #111111; }
.btn-g { background: rgba(16, 185, 129, 0.16); color: #34d399; border-color: rgba(16, 185, 129, 0.4); }
.btn-g:hover { background: rgba(16, 185, 129, 0.26); }
.btn-r { background: rgba(239, 68, 68, 0.16); color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
.btn-y { background: linear-gradient(135deg, #f59e0b, #d97706); color: #111; border: none; font-weight: 700; }
.btn-y:hover { opacity: 0.92; color: #111; }
.sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
.mut { font-size: 12px; color: var(--m); line-height: 1.45; }
.w1 { width: 100%; }
.hd { display: none !important; }
.lbl { font-size: 11px; font-weight: 600; color: var(--m); margin-bottom: 4px; display: block; }

.top {
  height: 54px;
  background: var(--bg);
  border-bottom: 1px solid var(--b);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  gap: 8px;
  position: sticky;
  top: 0;
  z-index: 40;
  flex-wrap: nowrap;
}
.logo { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; color: var(--t); white-space: nowrap; }

.wrap { display: flex; flex: 1; min-height: 0; }
.side-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 85; display: none; }
.side-bg.on { display: block; }

.side {
  width: 265px;
  background: var(--s1);
  border-right: 1px solid var(--b);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex-shrink: 0;
}
.nav {
  background: transparent;
  border: none;
  justify-content: flex-start;
  padding: 10px 12px;
  border-radius: 10px;
  color: var(--m);
  font-weight: 500;
  width: 100%;
}
.nav i { font-size: 18px; }
.nav:hover { background: var(--s2); color: var(--t); }
.nav.act { background: var(--s2); color: var(--t); font-weight: 600; }

.acc-btn {
  margin-top: auto;
  background: var(--s2);
  border: 1px solid var(--b);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  text-align: left;
  width: 100%;
}
.acc-btn:hover { background: var(--s3); border-color: #555; }
.ava {
  width: 36px; height: 36px; border-radius: 50%;
  background: #383838; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; flex-shrink: 0;
}

.main { flex: 1; padding: 16px; overflow-y: auto; max-width: 1100px; width: 100%; margin: 0 auto; }
.card { background: var(--s1); border: 1px solid var(--b); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.plan-card {
  background: var(--s1); border: 1px solid var(--b); border-radius: 16px; padding: 20px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 14px; position: relative;
}
.plan-card.pop { border: 2px solid #10b981; background: linear-gradient(180deg, rgba(16,185,129,0.08), var(--s1) 40%); }
.plan-card.vip { border: 2px solid #f59e0b; background: linear-gradient(180deg, rgba(245,158,11,0.08), var(--s1) 40%); }
.price-big { font-size: 28px; font-weight: 800; color: #fff; }
.feat-list { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #d4d4d4; }
.feat-list div { display: flex; align-items: center; gap: 8px; }
.feat-list i { color: var(--g); font-size: 16px; flex-shrink: 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sp { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 10px; }

.tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--s2); border: 1px solid var(--b); color: var(--m); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.tag.g { color: #34d399; border-color: rgba(16,185,129,0.35); background: rgba(16,185,129,0.1); }
.tag.r { color: #f87171; border-color: rgba(239,68,68,0.35); background: rgba(239,68,68,0.1); }
.tag.y { color: #fbbf24; border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.1); }

.msgs { height: 55vh; min-height: 290px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 6px 0; }
.msg { max-width: 88%; padding: 12px 15px; border-radius: 14px; background: var(--s1); border: 1px solid var(--b); white-space: pre-wrap; word-break: break-word; }
.msg.u { align-self: flex-end; background: #2f2f2f; border-color: #444; }
.msg pre { background: #111; border: 1px solid var(--b); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 6px 0; font-size: 12px; white-space: pre; }
.think { background: var(--s2); border-left: 3px solid #777; padding: 8px 10px; margin-bottom: 8px; font-size: 12px; color: var(--m); border-radius: 6px; }
.bar { height: 7px; background: var(--s2); border-radius: 99px; overflow: hidden; margin: 4px 0; }
.bar > i { display: block; height: 100%; background: var(--g); border-radius: 99px; }

.mod, .ban { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 14px; z-index: 100; background: rgba(0,0,0,0.78); }
.mod.on, .ban.on { display: flex; }
.mod-in { background: var(--s1); border: 1px solid #444; border-radius: 16px; padding: 20px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
.ban { background: #2a0808; color: #fecaca; z-index: 110; text-align: center; flex-direction: column; }
.toast { position: fixed; bottom: 18px; right: 18px; left: 18px; max-width: 360px; margin: 0 auto; background: #262626; border: 1px solid #555; padding: 11px 15px; border-radius: 10px; z-index: 105; display: none; }
.toast.on { display: flex; align-items: center; gap: 8px; }
.ad { background: var(--s1); border: 1px solid var(--b); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
iframe.sbx { width: 100%; height: 65vh; border: none; background: #fff; border-radius: 10px; }
.mob-btn { display: none; }
@media (max-width: 860px) {
  .desk-only { display: none !important; }
  .side { position: fixed; left: -275px; top: 0; bottom: 0; z-index: 90; transition: 0.2s ease; }
  .side.on { left: 0; }
  .mob-btn { display: inline-flex; }
  .msg { max-width: 96%; }
}
</style>
</head>
<body>
<div id="side-bg" class="side-bg" onclick="toggleMenu(false)"></div>
<header class="top">
  <div class="row" style="flex-wrap:nowrap">
    <button class="mob-btn sm" onclick="toggleMenu(true)"><i class="ri-menu-line"></i></button>
    <div class="logo"><i class="ri-openai-fill"></i><span>NEXUS Arena</span></div>
  </div>
  <div id="stats-bar" class="row mut desk-only"></div>
  <div class="row" style="flex-wrap:nowrap">
    <button class="sm btn-y" onclick="go('bill')"><i class="ri-vip-crown-fill"></i>PRO / ULTRA</button>
    <button class="sm" onclick="S.msgs=[];localStorage.setItem('nx_msgs','[]');go('chat')"><i class="ri-add-line"></i>Новый чат</button>
  </div>
</header>

<div class="wrap">
  <aside id="side" class="side">
    <div class="row sp mob-btn" style="padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--b)">
      <b>NEXUS Arena</b>
      <button class="sm" onclick="toggleMenu(false)">✕</button>
    </div>
    <button class="nav act" data-t="chat" onclick="go('chat')"><i class="ri-chat-3-line"></i>Чат с ИИ</button>
    <button class="nav" data-t="cat" onclick="go('cat')"><i class="ri-compass-3-line"></i>Каталог моделей</button>
    <button class="nav" data-t="bill" onclick="go('bill')"><i class="ri-vip-diamond-line" style="color:var(--y)"></i>Тарифы и Сброс 5ч <span class="tag y" style="margin-left:auto">ХИТ</span></button>
    <button class="nav" data-t="keys" onclick="go('keys')"><i class="ri-key-2-line"></i>Заработок на ключах</button>
    <button class="nav" data-t="sbx" onclick="go('sbx')"><i class="ri-code-box-line"></i>HTML Песочница</button>
    <button class="nav" id="nav-adm" data-t="adm" onclick="go('adm')"><i class="ri-shield-star-line"></i>Админ-панель</button>

    <div id="acc-box" class="acc-btn" onclick="openAccountModal()">
      <div class="ava" id="acc-ava">U</div>
      <div style="flex:1;min-width:0">
        <div class="row sp" style="gap:4px">
          <b id="acc-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Профиль</b>
          <span class="tag g" id="acc-plan">FREE</span>
        </div>
        <div class="mut" id="acc-mail" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Загрузка...</div>
      </div>
      <i class="ri-settings-4-line mut"></i>
    </div>
  </aside>
  <main class="main">
    <div id="ad-box" class="ad hd"></div>
    <div id="view"></div>
  </main>
</div>
<div id="mod" class="mod" onclick="if(event.target===this)closeMod()"><div id="mod-in" class="mod-in"></div></div>
<div id="ban" class="ban"></div>
<div id="toast" class="toast"></div>
<script>
const API = 'https://omni-api.aegertcool.workers.dev';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

window.S = {
  tok: localStorage.getItem('nx_tok') || localStorage.getItem('token') || '',
  user: JSON.parse(localStorage.getItem('nx_user_cache') || 'null'),
  ad: null,
  cap: null,
  needCode: false,
  authMode: 'login',
  cat: [],
  mid: +localStorage.getItem('nx_mid') || 0,
  msgs: JSON.parse(localStorage.getItem('nx_msgs') || '[]'),
  mem: JSON.parse(localStorage.getItem('nx_mem') || '[]'),
  tab: 'chat',
  cStep: 0,
  sbx: [],
  payInfo: {}
};

function toggleMenu(on) {
  $('side').classList.toggle('on', on);
  $('side-bg').classList.toggle('on', on);
}

function getDev() {
  let d = localStorage.getItem('nx_trusted_dev') || localStorage.getItem('deviceId') || localStorage.getItem('nx_dev');
  if (!d) d = 'd_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem('nx_dev', d);
  localStorage.setItem('deviceId', d);

  let h = localStorage.getItem('nx_trusted_hw') || localStorage.getItem('hwHash') || localStorage.getItem('nx_hw');
  if (!h) {
    let s = navigator.userAgent + '|' + screen.width + 'x' + screen.height;
    let hash = 0;
    for (let i = 0; i < s.length; i++) hash = ((hash << 5) - hash + s.charCodeAt(i)) | 0;
    h = 'hw_' + Math.abs(hash).toString(16);
  }
  localStorage.setItem('nx_hw', h);
  localStorage.setItem('hwHash', h);
  return { d, h };
}

function toast(m) {
  const t = $('toast');
  t.innerHTML = `<i class="ri-checkbox-circle-fill" style="color:var(--g)"></i><span>${esc(m)}</span>`;
  t.classList.add('on');
  clearTimeout(window._tTimer);
  window._tTimer = setTimeout(() => t.classList.remove('on'), 3500);
}

function openMod(h) { $('mod-in').innerHTML = h; $('mod').classList.add('on'); }
function closeMod() { $('mod').classList.remove('on'); }

async function api(p, o = {}) {
  try {
    const { d, h } = getDev();
    const r = await fetch(API + p, {
      method: o.method || (o.body ? 'POST' : 'GET'),
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + S.tok,
        'X-Device-Id': d,
        'X-Hw-Hash': h
      },
      body: o.body ? JSON.stringify(o.body) : undefined
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 403 && data.errorCode === 'DEVICE_BANNED') {
      showBan(data.reasons);
      throw new Error('DEVICE_BANNED');
    }
    return { status: r.status, ok: r.ok && data.ok !== false, data };
  } catch (e) {
    if (e.message === 'DEVICE_BANNED') throw e;
    return { status: 0, ok: false, data: { error: 'Ошибка сети' } };
  }
}

function showBan(rs) {
  const b = $('ban');
  b.classList.add('on');
  b.innerHTML = `
    <div class="card col" style="max-width:460px;background:#1f0707;border-color:var(--r)">
      <h2>⚠️⚠️ ИЗВИНИТЕ, НО ВЫ ЗАБАНЕНЫ ПО ЭТОЙ ПРИЧИНЕ ⚠️⚠️</h2>
      <p>${esc(Array.isArray(rs) ? rs.join(', ') : (rs || 'Нарушение правил'))}</p>
      <input id="ban-u" class="w1" placeholder="Ваш никнейм" value="${esc(S.user?.username || '')}">
      <textarea id="ban-m" class="w1" rows="3" placeholder="Причина для разбана..."></textarea>
      <button class="btn w1" onclick="sendAppeal()">Отправить обжалование</button>
    </div>`;
}

async function sendAppeal() {
  const { ok, data } = await api('/api/ban/appeal', { body: { username: $('ban-u').value, message: $('ban-m').value } });
  toast(ok ? 'Апелляция отправлена!' : (data.error || 'Ошибка'));
}

function updateSidebarAccount() {
  if (!S.tok || !S.user) {
    $('acc-ava').textContent = '→';
    $('acc-name').textContent = 'Войти / Регистрация';
    $('acc-plan').textContent = 'Гость';
    $('acc-mail').textContent = 'Нажмите для входа';
    return;
  }
  $('acc-ava').textContent = (S.user.username || 'U')[0].toUpperCase();
  $('acc-name').textContent = S.user.username;
  $('acc-plan').textContent = (S.user.plan || 'FREE').toUpperCase();
  $('acc-mail').textContent = S.user.email || 'Почта подтверждена';
}

async function syncFirstDevice(silent = false) {
  if (!S.user?.devices?.length) return;
  const devs = S.user.devices;
  const first = devs.find(x => x.is_trusted || x.trusted) || devs[0];
  if (first) {
    const devId = first.device_id || first.deviceId;
    const hw = first.hw_hash || first.hwHash;
    if (devId) { localStorage.setItem('nx_trusted_dev', devId); localStorage.setItem('nx_dev', devId); }
    if (hw) { localStorage.setItem('nx_trusted_hw', hw); localStorage.setItem('nx_hw', hw); }
  }
  for (const dv of devs) {
    await api('/api/devices/trust', { body: { deviceRowId: dv.id } });
  }
  if (!silent) {
    toast('Родной ID устройства установлен и подтверждён!');
    await loadMe();
  }
}

function openAccountModal() {
  if (!S.tok || !S.user) { go('auth'); return; }
  const u = S.user, l = u.limits || {}, w = u.wallet || {};
  const bar = (a, b) => `<div class="bar"><i style="width:${Math.min(100, ((a || 0) / (b || 1)) * 100)}%"></i></div>`;
  const curDev = getDev().d;
  openMod(`
    <div class="col">
      <div class="row sp">
        <div class="row">
          <div class="ava" style="width:44px;height:44px;font-size:18px">${esc((u.username || 'U')[0].toUpperCase())}</div>
          <div>
            <h3>${esc(u.username)} <span class="tag g">${esc(u.plan || 'FREE')}</span></h3>
            <div class="mut"><i class="ri-mail-check-line" style="color:var(--g)"></i> Gmail / Почта: <b>${esc(u.email || 'не указана')}</b></div>
          </div>
        </div>
        <button class="sm" onclick="closeMod()">✕</button>
      </div>

      <div class="card col" style="margin:0;padding:12px;background:var(--s2);border-color:#444">
        <span class="lbl">🎟 ВВЕСТИ ПРОМОКОД НА ПОДПИСКУ ИЛИ БОНУС</span>
        <div class="row">
          <input id="mod-prm" placeholder="Введите промокод..." style="flex:1">
          <button class="btn sm" onclick="pAct('/api/promo/redeem',{code:$('mod-prm').value});closeMod()">Активировать</button>
        </div>
      </div>

      <div class="card col" style="margin:0;padding:12px">
        <div class="row sp">
          <span>🔥 Ежедневный бонус: <b>${u.checkinStreak || 0} дн. подряд</b></span>
          <button class="sm btn-g" onclick="pAct('/api/bonus/checkin',{});closeMod()">🎁 Забрать бонус</button>
        </div>
        <div><span class="lbl">Лимит 5 часов: ${l.used5h || 0} из ${l.cap5h || 0}</span>${bar(l.used5h, l.cap5h)}</div>
        <div><span class="lbl">Лимит на неделю: ${l.usedWeek || 0} из ${l.capWeek || 0}</span>${bar(l.usedWeek, l.capWeek)}</div>
        <div><span class="lbl">Лимит на месяц: ${l.usedMonth || 0} из ${l.capMonth || 0}</span>${bar(l.usedMonth, l.capMonth)}</div>
        <div class="row sp mut" style="margin-top:4px">
          <span>Реф-код: <b class="mono">${esc(u.refCode || '-')}</b></span>
          <button class="sm btn-y" onclick="closeMod();go('bill')">⚡ Улучшить тариф / Сбросить 5ч</button>
        </div>
      </div>

      <div class="card col" style="margin:0;padding:12px">
        <span class="lbl">💰 Кошелёк: ${w.balanceRub || 0} ₽ (заработано ${w.totalEarnedRub || 0} ₽, вывод от 300 ₽)</span>
        <div class="row">
          <input id="wd-d" placeholder="Номер карты / телефона СБП" style="flex:1">
          <button class="sm btn" onclick="if((${w.balanceRub || 0})<300)return toast('Вывод от 300 ₽!');pAct('/api/wallet/withdraw',{details:$('wd-d').value})">Вывести</button>
        </div>
      </div>

      <div class="card col" style="margin:0;padding:12px">
        <div class="row sp">
          <span class="lbl" style="margin:0">📱 Устройства аккаунта (Текущий: ${esc(curDev.slice(0, 10))}...)</span>
          <button class="sm btn-g" onclick="syncFirstDevice(false);closeMod()">Синхронизировать 1-е</button>
        </div>
        ${(u.devices || []).map((d, idx) => `
          <div class="row sp mut" style="padding:4px 0;border-top:1px solid var(--b)">
            <span>#${idx + 1}: ${esc(d.device_id || d.id)} ${d.is_trusted || d.trusted ? '✅ Родное' : '⏳ Новое'}</span>
            <div class="row">
              <button class="sm btn-g" onclick="localStorage.setItem('nx_trusted_dev','${esc(d.device_id || '')}');pAct('/api/devices/trust',{deviceRowId:${d.id}});closeMod()">Взять этот ID</button>
            </div>
          </div>`).join('') || '<span class="mut">Текущее устройство активно</span>'}
      </div>

      <button class="sm btn-r w1" onclick="closeMod();logout()"><i class="ri-logout-box-r-line"></i>Выйти из аккаунта (${esc(u.username)})</button>
    </div>`);
}

async function loadStats() {
  const { ok, data } = await api('/api/stats');
  if (ok) {
    $('stats-bar').innerHTML = `<span class="tag">👥 Юзеров: ${data.users || 0}</span><span class="tag">🤖 Моделей: ${data.models || 0}</span><span class="tag">⚡ Запросов: ${data.requests || 0}</span>`;
    if (data.ad?.enabled) {
      $('ad-box').classList.remove('hd');
      $('ad-box').innerHTML = `<div><b>${esc(data.ad.title)}</b> <span class="mut">${esc(data.ad.text)}</span></div>` + (data.ad.url ? `<a class="btn sm" target="_blank" href="${esc(data.ad.url)}">Перейти</a>` : '');

async function loadMe() {
  updateSidebarAccount();
  if (!S.tok) return go(['cat', 'adm', 'sbx', 'bill'].includes(S.tab) ? S.tab : 'auth');
  const { status, ok, data } = await api('/api/auth/me');
  if (status === 401) {
    S.tok = ''; S.user = null;
    localStorage.removeItem('nx_tok'); localStorage.removeItem('nx_user_cache');
    updateSidebarAccount();
    return go('auth');
  }
  if (ok && data.user) {
    S.user = data.user;
    localStorage.setItem('nx_user_cache', JSON.stringify(S.user));
    updateSidebarAccount();
    if (!localStorage.getItem('nx_trusted_dev') && S.user.devices?.length) {
      await syncFirstDevice(true);
    }
  }
  go(S.tab === 'auth' ? 'chat' : S.tab);
}

function logout() {
  S.tok = ''; S.user = null;
  localStorage.removeItem('nx_tok'); localStorage.removeItem('nx_user_cache');
  updateSidebarAccount();
  go('auth');
}

function go(t) {
  toggleMenu(false);
  if (!S.tok && !['auth', 'cat', 'adm', 'sbx', 'bill'].includes(t)) t = 'auth';
  S.tab = t;
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('act', n.dataset.t === t));
  if (t === 'auth') renderAuth();
  else if (t === 'chat') renderChat();
  else if (t === 'cat') renderCat();
  else if (t === 'sbx') renderSbxPage();
  else if (t === 'keys') renderKeys();
  else if (t === 'bill') renderBill();
  else if (t === 'adm') renderAdm();
}
</script>

function fmtMsg(m, i) {

  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => {
    const isH = l.toLowerCase() === 'html' || c.includes('<html') || c.includes('<!DOCTYPE') || c.includes('<body');
    S.sbx[i] = c;
    return `<pre>${c}</pre>` + (isH ? `<button class="sm btn-g" onclick="runSbx(${i})">▶ Запустить HTML в песочнице</button>` : '');

  const d = (S.sbx[i] || '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'");

      <div class="row sp mut">
        <span>Есть промокод? <a onclick="openAccountModal()">Активировать в профиле →</a></span>
        <button class="sm btn-r" id="ca-b" onclick="canAuto()">Отменить автооплату (в 3 клика)</button>
      </div>
    </div>`;
}

function openPayModal(type, title, price) {
  const ph = S.payInfo.phone || 'Уточните в поддержке';
  const bk = S.payInfo.bank || 'Сбербанк';
  openMod(`
    <div class="col">
      <div class="row sp"><h3>Оплата: ${esc(title)}</h3><button class="sm" onclick="closeMod()">✕</button></div>
      <div class="card col" style="margin:0;background:var(--s2);border-color:var(--g)">
        <div class="row sp"><span class="mut">Сумма к переводу:</span><b style="font-size:20px;color:var(--g)">${esc(price)}</b></div>
        <div class="row sp">
          <div><span class="lbl">Перевод по номеру (${esc(bk)})</span><b class="mono" style="font-size:16px">${esc(ph)}</b></div>
          <button class="sm btn" onclick="navigator.clipboard.writeText('${esc(ph)}');toast('Номер скопирован!')">📋 Копировать</button>
        </div>
      </div>
      <div><span class="lbl">Ваш логин для зачисления</span><input id="bl-n" class="w1" value="${esc(S.user?.username || '')}"></div>
      <div><span class="lbl">Имя отправителя / комментарий (кто перевёл)</span><input id="bl-s" class="w1" placeholder="Например: Саша П., перевёл ${esc(price)}"></div>
      <button class="btn-g w1" style="padding:12px" onclick="ordB('${type}')">✅ Я перевёл — Отправить заявку на выдачу</button>
      <div class="mut" style="text-align:center">⚡ Подписка выдаётся сразу после проверки перевода администратором</div>
    </div>`);
}

async function ordB(t) {
  const { ok, data } = await api('/api/billing/order', { body: { itemType: t, customNick: $('bl-n').value, senderNote: $('bl-s').value } });
  if (ok) closeMod();
  toast(ok ? 'Заявка отправлена! Ожидайте выдачи тарифа' : (data.error || 'Ошибка заявки'));
}

async function canAuto() {
  S.cStep++;
  if (S.cStep < 3) $('ca-b').textContent = `Подтвердите отмену (${S.cStep + 1}/3)`;
  else { await pAct('/api/billing/cancel-auto', {}); S.cStep = 0; }
}

async function adm(p, b, m = 'POST') {
  const r = await api('/api/admin/' + p, { method: m, body: b });
  toast(r.ok ? 'Сохранено!' : (r.data.error || 'Ошибка'));
  if (r.ok) renderAdm();
}

async function renderAdm() {
  const { ok, data } = await api('/api/admin/overview');
  const d = data || {}, pc = d.payConfig || {}, ad = d.ad || {};
  const uDevs = S.user?.devices || [];
  $('view').innerHTML = `
    <div class="card col">
      <div class="row sp">
        <div>
          <h3>🛡️ Админ-панель (${esc(S.user?.username || 'Гость')})</h3>
          <div class="mut">${ok ? '✅ Сервер подтвердил ROOT-доступ' : '⚠️ Ответ сервера: ' + esc(d.error || 'Требуется родное устройство')}</div>
        </div>
        <button class="btn sm" onclick="syncFirstDevice(false)">🔄 Взять ID 1-го устройства</button>
      </div>
      ${!ok && uDevs.length ? `
        <div class="row" style="padding-top:8px;border-top:1px solid var(--b)">
          <span class="mut">Выберите ваше старое устройство без карантина 48ч:</span>
          ${uDevs.map((dv, idx) => `<button class="sm btn-g" onclick="localStorage.setItem('nx_trusted_dev','${esc(dv.device_id || '')}');toast('Выбрано устройство #${idx+1}');renderAdm()">Устройство #${idx + 1} (${esc((dv.device_id || '').slice(0, 8))})</button>`).join('')}
        </div>` : ''}
    </div>
    <div class="grid">
      <div class="card col">
        <h4>📦 Заявки на оплату (${(d.orders || []).length})</h4>
        ${(d.orders || []).map(o => `
          <div class="row sp mut" style="padding:6px 0;border-bottom:1px solid var(--b)">
            <span><b>${esc(o.custom_nick || o.username)}</b>: ${esc(o.item_type)} (${esc(o.sender_note || '')})</span>
            <div class="row">
              <button class="sm btn-g" onclick="adm('order-resolve',{orderId:${o.id},approve:true})">Выдать</button>
              <button class="sm btn-r" onclick="adm('order-resolve',{orderId:${o.id},approve:false})">✕</button>
            </div>
          </div>`).join('') || '<span class="mut">Новых заказов пока нет</span>'}
      </div>
      <div class="card col">
        <h4>🏦 Реквизиты Сбербанк и ТГ</h4>
        <input id="ap-p" placeholder="Телефон Сбербанка" value="${esc(pc.phone || '')}">
        <input id="ap-b" placeholder="Банк" value="${esc(pc.bank || 'Сбербанк')}">
        <input id="ap-t" placeholder="TG Token" value="${esc(pc.tgToken || '')}">
        <input id="ap-c" placeholder="TG Chat ID" value="${esc(pc.tgChatId || '')}">
        <button class="btn sm" onclick="adm('pay-config',{phone:$('ap-p').value,bank:$('ap-b').value,tgToken:$('ap-t').value,tgChatId:$('ap-c').value})">Сохранить</button>
      </div>
      <div class="card col">
        <h4>🎟 Промокоды</h4>
        <div class="row">
          <input id="pr-c" placeholder="Код" style="flex:1">
          <select id="pr-p"><option>PRO</option><option>ULTRA</option></select>
          <input id="pr-d" value="30" style="width:55px">
          <button class="sm btn" onclick="adm('promo',{code:$('pr-c').value,plan:$('pr-p').value,days:+$('pr-d').value})">+</button>
        </div>
        ${(d.promos || []).map(p => `<div class="row sp mut"><span><b>${esc(p.code)}</b> (${esc(p.plan)})</span><button class="sm btn-r" onclick="adm('promo/'+encodeURIComponent('${esc(p.code)}'),null,'DELETE')">✕</button></div>`).join('')}
      </div>
      <div class="card col">
        <h4>📢 Реклама</h4>
        <label class="row mut"><input type="checkbox" id="aa-e" ${ad.enabled ? 'checked' : ''}> Включить баннер</label>
        <input id="aa-t" placeholder="Заголовок" value="${esc(ad.title || '')}">
        <input id="aa-x" placeholder="Текст" value="${esc(ad.text || '')}">
        <input id="aa-u" placeholder="URL" value="${esc(ad.url || '')}">
        <button class="btn sm" onclick="adm('ad',{enabled:$('aa-e').checked,title:$('aa-t').value,text:$('aa-x').value,url:$('aa-u').value})">Сохранить</button>
      </div>
      <div class="card col">
        <h4>👥 Пользователи (${(d.users || []).length})</h4>
        ${(d.users || []).map(u => `
          <div class="row sp mut">
            <span><b>${esc(u.username)}</b> [${esc(u.plan)}]</span>
            <div class="row">
              <select id="up-${u.id}"><option>FREE</option><option>PRO</option><option>ULTRA</option></select>
              <button class="sm btn-g" onclick="adm('user-plan',{targetUserId:${u.id},plan:$('up-${u.id}').value,days:30})">ОК</button>
              <button class="sm btn-r" onclick="adm('user-ban',{targetUserId:${u.id},ban:${!u.is_banned}})">${u.is_banned ? 'Разбан' : 'Бан'}</button>
            </div>
          </div>`).join('')}
      </div>
      <div class="card col">
        <h4>⚖️ Апелляции и Ключи</h4>
        ${(d.appeals || []).map(a => `<div class="row sp mut"><span>${esc(a.username)}: ${esc(a.message)}</span><button class="sm btn-g" onclick="adm('appeal',{appealId:${a.id},id:${a.id},approve:true})">Разбан</button></div>`).join('')}
        ${(d.keys || []).map(k => `<div class="row sp mut"><span>🔑 ${esc(k.title || k.id)}</span><button class="sm btn-r" onclick="adm('key/${k.id}',null,'DELETE')">✕</button></div>`).join('')}
      </div>
    </div>`;
}

loadStats();
loadMe();
</script>
</body>
</html>
