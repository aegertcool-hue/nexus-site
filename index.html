<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS AI — Official Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root{--bg:#0b0c10;--s1:rgba(22,24,32,.85);--s2:#1c1f2b;--s3:#25293a;--b:rgba(255,255,255,.08);--bh:rgba(138,180,248,.4);--t:#f1f3f9;--m:#8b93a7;--a:#8ab4f8;--a2:#c58af9;--g:#4ade80;--r:#f87171;--y:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:99px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
body{font:14px/1.5 'Inter',system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0%,rgba(138,180,248,.12),transparent 55%),var(--bg);color:var(--t);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
code,pre,.mono{font-family:'JetBrains Mono',monospace}
a{color:var(--a);cursor:pointer;text-decoration:none;transition:.2s}
a:hover{color:var(--a2);text-decoration:underline}
button,input,select,textarea{font:inherit;color:var(--t);background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:9px 12px;outline:none;transition:all .2s cubic-bezier(.22,1,.36,1)}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(138,180,248,.15);background:#202432}
button{cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{border-color:var(--bh);transform:translateY(-1px);background:var(--s3)}
button:active{transform:translateY(0) scale(.98)}
.btn{background:linear-gradient(135deg,var(--a),#669df6);color:#08101d;border:none;font-weight:600;box-shadow:0 4px 14px rgba(138,180,248,.25)}
.btn:hover{background:linear-gradient(135deg,#9bbff9,var(--a));box-shadow:0 6px 20px rgba(138,180,248,.4);color:#08101d}
.btn-r{background:rgba(248,113,113,.12);color:var(--r);border-color:rgba(248,113,113,.3)}
.btn-g{background:rgba(74,222,128,.12);color:var(--g);border-color:rgba(74,222,128,.3)}
  .sm{padding:5px 10px;font-size:12px;border-radius:8px}
.mut{font-size:12px;color:var(--m)}.w1{width:100%}.hd{display:none!important}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--m);margin-bottom:2px;display:block}
.top{height:58px;background:rgba(15,17,23,.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:10px;position:sticky;top:0;z-index:30}
.logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;letter-spacing:-.3px}
.logo i{color:var(--a);font-size:20px;filter:drop-shadow(0 0 8px rgba(138,180,248,.5))}
.logo span{background:linear-gradient(90deg,#fff,var(--a),var(--a2));-webkit-background-clip:text;color:transparent}
.wrap{display:flex;flex:1;min-height:0}
.side{width:230px;background:var(--s1);backdrop-filter:blur(16px);border-right:1px solid var(--b);padding:12px;display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.nav{background:transparent;border:1px solid transparent;justify-content:flex-start;padding:10px 12px;border-radius:10px;color:var(--m);font-weight:500}
.nav i{font-size:17px;transition:.2s}
.nav:hover{background:var(--s2);color:var(--t);transform:translateX(2px)}
.nav.act{background:rgba(138,180,248,.12);color:var(--a);border-color:rgba(138,180,248,.25)}
.main{flex:1;padding:18px;overflow-y:auto;max-width:1220px;width:100%;margin:0 auto}
.card{background:var(--s1);backdrop-filter:blur(12px);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fadeUp .25s ease}
.card:hover{border-color:rgba(255,255,255,.14)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:10px}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--s2);border:1px solid var(--b);color:var(--m);display:inline-flex;align-items:center;gap:4px}
.tag.b{color:var(--a);background:rgba(138,180,248,.1);border-color:rgba(138,180,248,.3)}
.tag.g{color:var(--g);background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3)}
.tag.r{color:var(--r);background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3)}
  .msgs{height:50vh;min-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px}
.msg{max-width:88%;padding:12px 14px;border-radius:14px;background:var(--s2);border:1px solid var(--b);white-space:pre-wrap;word-break:break-word;animation:fadeUp .2s ease}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,#1e3a5f,#17253b);border-color:rgba(138,180,248,.35)}
.msg pre{background:#090a0f;border:1px solid var(--b);padding:10px;border-radius:10px;overflow-x:auto;margin:8px 0;font-size:12px;white-space:pre}
.think{background:rgba(138,180,248,.06);border-left:3px solid var(--a);padding:8px 10px;margin-bottom:8px;font-size:12px;color:var(--m);border-radius:6px}
.bar{height:8px;background:var(--s2);border-radius:99px;overflow:hidden;margin:5px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:99px;transition:width .4s ease}
.mod,.ban{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;z-index:60;backdrop-filter:blur(8px)}
.mod{background:rgba(5,6,10,.75)}.mod.on,.ban.on{display:flex}.mod-in{background:#161821;border:1px solid var(--b);border-radius:16px;padding:18px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;animation:fadeUp .2s ease}
.ban{background:radial-gradient(circle,#450a0a,#1a0505);color:#fecaca;z-index:99;text-align:center;flex-direction:column}
.toast{position:fixed;bottom:18px;right:18px;background:#1c202e;border:1px solid var(--a);box-shadow:0 8px 24px rgba(0,0,0,.5);padding:11px 16px;border-radius:12px;z-index:95;display:none;animation:fadeUp .2s ease}
.toast.on{display:flex;align-items:center;gap:8px}
.ad{background:linear-gradient(90deg,rgba(138,180,248,.12),rgba(197,138,249,.12));border:1px solid rgba(138,180,248,.3);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
iframe.sbx{width:100%;height:65vh;border:none;background:#fff;border-radius:10px}.mob-btn{display:none}
@media(max-width:780px){.side{position:fixed;left:-240px;top:58px;bottom:0;z-index:40;transition:.25s}.side.on{left:0}.mob-btn{display:inline-flex}.msg{max-width:96%}}
</style>
</head>
<body>
<header class="top">
 <div class="row">
  <button class="mob-btn sm" onclick="$('side').classList.toggle('on')"><i class="ri-menu-2-line"></i></button>
  <div class="logo"><i class="ri-sparkling-2-fill"></i><span>NEXUS AI</span><small class="tag b">STUDIO</small></div>
 </div>
 <div id="stats-bar" class="row mut"></div>
 <div id="top-user" class="row"></div>
</header>
<div class="wrap">
 <aside id="side" class="side">
  <span class="lbl" style="padding:4px 8px">Навигация</span>
  <button class="nav act" data-t="chat" onclick="go('chat')"><i class="ri-chat-smile-3-line"></i>Чат Studio</button>
  <button class="nav" data-t="cat" onclick="go('cat')"><i class="ri-apps-2-line"></i>Каталог ИИ</button>
  <button class="nav" data-t="keys" onclick="go('keys')"><i class="ri-key-2-line"></i>Маркет ключей</button>
  <button class="nav" data-t="prof" onclick="go('prof')"><i class="ri-user-star-line"></i>Мой профиль</button>
  <button class="nav" data-t="bill" onclick="go('bill')"><i class="ri-vip-crown-2-line"></i>Тарифы и оплата</button>
  <button class="nav" id="nav-adm" data-t="adm" onclick="go('adm')"><i class="ri-shield-flash-line"></i>Админ-центр</button>
  <div id="side-foot" class="mut" style="margin-top:auto;padding:8px;border-top:1px solid var(--b)">
   <i class="ri-checkbox-circle-fill" style="color:var(--g)"></i> NEXUS v5.1 • 199-ФЗ
  </div>
 </aside>
 <main class="main">
  <div id="ad-box" class="ad hd"></div>
  <div id="view"></div>
 </main>
</div>
<div id="mod" class="mod" onclick="if(event.target===this)closeMod()"><div id="mod-in" class="mod-in"></div></div>
<div id="ban" class="ban"></div>
<div id="toast" class="toast"></div>
<script>
const API='https://omni-api.aegertcool.workers.dev',$=id=>document.getElementById(id),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={tok:localStorage.getItem('nx_tok')||'',user:null,ad:null,cap:null,needCode:false,
authMode:'login',cat:[],mid:+localStorage.getItem('nx_mid')||0,
msgs:JSON.parse(localStorage.getItem('nx_msgs')||'[]'),
mem:JSON.parse(localStorage.getItem('nx_mem')||'[]'),tab:'chat',cStep:0,sbx:[],admTab:'orders'};
  function getDev(){
 let d=localStorage.getItem('nx_dev');
 if(!d){d='d_'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('nx_dev',d)}
 let s=navigator.userAgent+'|'+screen.width+'x'+screen.height,h=0;
 for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;
 return{d,h:'hw_'+Math.abs(h).toString(16)};
}
function toast(m){
 const t=$('toast');t.innerHTML=`<i class="ri-information-fill" style="color:var(--a)"></i><span>${esc(m)}</span>`;
 t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3400);
}
function openMod(h){$('mod-in').innerHTML=h;$('mod').classList.add('on')}
function closeMod(){$('mod').classList.remove('on')}
async function api(p,o={}){
 const {d,h}=getDev();
 const r=await fetch(API+p,{method:o.method||(o.body?'POST':'GET'),
  headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.tok,'X-Device-Id':d,'X-Hw-Hash':h},
  body:o.body?JSON.stringify(o.body):undefined});
 const data=await r.json().catch(()=>({}));
 if(r.status===403&&data.errorCode==='DEVICE_BANNED'){showBan(data.reasons);throw Error('BANNED')}
 return{status:r.status,ok:r.ok&&data.ok!==false,data};
}
function showBan(rs){
 const b=$('ban');b.classList.add('on');
 b.innerHTML=`<div class="card col" style="max-width:480px;background:#2d0a0a;border-color:var(--r)">
  <h2>⚠️⚠️ ИЗВИНИТЕ, НО ВЫ ЗАБАНЕНЫ ПО ЭТОЙ ПРИЧИНЕ ⚠️⚠️</h2>
  <p class="mut">${esc(Array.isArray(rs)?rs.join(', '):rs||'Нарушение правил платформы')}</p>
  <input id="ban-u" placeholder="Ваш логин" value="${esc(S.user?.username||'')}">
  <textarea id="ban-m" rows="3" placeholder="Опишите причину для разбана..."></textarea>
  <button class="btn" onclick="sendAppeal()"><i class="ri-mail-send-line"></i>Отправить апелляцию</button></div>`;
}
async function sendAppeal(){
 const {ok,data}=await api('/api/ban/appeal',{body:{username:$('ban-u').value,message:$('ban-m').value}});
 toast(ok?'Апелляция отправлена администратору!':(data.error||'Ошибка отправки'));
}
  function renderAd(a){
 if(!a)return;S.ad=a;const b=$('ad-box');
 if(!a.enabled){b.classList.add('hd');return}
 b.classList.remove('hd');
 b.innerHTML=`<div class="row"><span class="tag b"><i class="ri-megaphone-line"></i>Реклама</span><b>${esc(a.title)}</b><span class="mut">${esc(a.text)}</span></div>`+(a.url?`<a class="btn sm" target="_blank" href="${esc(a.url)}">Открыть <i class="ri-external-link-line"></i></a>`:'');
}
async function loadStats(){
 const {ok,data}=await api('/api/stats');
 if(ok){
  $('stats-bar').innerHTML=`<span class="tag"><i class="ri-user-3-line"></i>Юзеров: ${data.users||0}</span><span class="tag"><i class="ri-cpu-line"></i>Моделей: ${data.models||0}</span><span class="tag"><i class="ri-flashlight-line"></i>Запросов: ${data.requests||0}</span>`;
  renderAd(data.ad);
 }
}
async function loadMe(){
 if(!S.tok){$('top-user').innerHTML=`<button class="btn sm" onclick="go('auth')"><i class="ri-login-box-line"></i>Войти</button>`;return go('auth')}
 const {ok,data}=await api('/api/auth/me');
 if(!ok){S.tok='';localStorage.removeItem('nx_tok');return go('auth')}
 S.user=data.user;renderAd(data.ad);
 $('top-user').innerHTML=`<span class="tag b"><i class="ri-vip-diamond-line"></i>${esc(S.user.plan||'FREE')}</span><b>${esc(S.user.username)}</b><button class="sm btn-r" onclick="logout()"><i class="ri-logout-box-r-line"></i></button>`;
 go(S.tab==='auth'?'chat':S.tab);
}
function logout(){S.tok='';S.user=null;localStorage.removeItem('nx_tok');loadMe()}
function go(t){
 $('side').classList.remove('on');
 if(!S.tok&&t!=='auth'&&t!=='cat'&&t!=='adm')t='auth';
 S.tab=t;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('act',n.dataset.t===t));
 if(t==='auth')renderAuth();else if(t==='chat')renderChat();else if(t==='cat')renderCat();
 else if(t==='keys')renderKeys();else if(t==='prof')renderProf();else if(t==='bill')renderBill();else if(t==='adm')renderAdm();
}
async function loadCap(){
 const {ok,data}=await api('/api/captcha/challenge');
 if(ok){S.cap=data;if($('cap-q'))$('cap-q').textContent=data.question}
}
function showRules(){
 openMod(`<div class="col"><h3><i class="ri-scales-3-line" style="color:var(--a)"></i> Правила NEXUS AI (199-ФЗ РФ)</h3>
  <p class="mut">1. Регистрация и вход разрешены только через логин и электронную почту (без зарубежных OAuth-сервисов Google/Apple/TG согласно 199-ФЗ РФ).</p>
  <p class="mut">2. Запрещены мультиаккаунты, обход квот и вредоносные промпты — система автоматически блокирует устройство по Hardware Hash.</p>
  <button class="btn w1" onclick="closeMod()">Принимаю правила</button></div>`);
}
  function renderAuth(){
 const reg=S.authMode==='register';
 $('view').innerHTML=`<div class="card col" style="max-width:440px;margin:16px auto">
  <div class="row sp"><h3><i class="ri-shield-user-line" style="color:var(--a)"></i> ${reg?'Регистрация аккаунта':'Вход в NEXUS AI'}</h3><span class="tag b">199-ФЗ РФ</span></div>
  <div class="row"><button class="w1 ${!reg?'btn':''}" onclick="S.authMode='login';renderAuth()"><i class="ri-login-circle-line"></i>Вход</button>
   <button class="w1 ${reg?'btn':''}" onclick="S.authMode='register';renderAuth()"><i class="ri-user-add-line"></i>Регистрация</button></div>
  <div><span class="lbl">Ваш логин (никнейм)</span><input id="au-u" class="w1" placeholder="Например: asdcreator"></div>
  ${reg?'<div><span class="lbl">Электронная почта (для 5-значного кода)</span><input id="au-e" type="email" class="w1" placeholder="name@mail.ru"></div>':''}
  <div><span class="lbl">Пароль</span><input id="au-p" type="password" class="w1" placeholder="••••••••"></div>
  ${reg?'<div><span class="lbl">Реферальный код (если есть)</span><input id="au-ref" class="w1" placeholder="Необязательно"></div>':''}
  <div class="card" style="margin:0;padding:10px;background:var(--s2)"><span class="lbl">Проверка безопасности (Капча)</span>
   <div class="row"><span class="tag b" style="font-size:13px"><i class="ri-calculator-line"></i> <b id="cap-q">Загрузка...</b></span>
    <input id="cap-a" placeholder="Ответ" style="flex:1"><button class="sm" onclick="loadCap()"><i class="ri-refresh-line"></i></button></div></div>
  ${reg||S.needCode?`<div class="card col" style="margin:0;padding:10px;border-color:var(--a)"><span class="lbl">Подтверждение по почте (3 ошибки сжигают код!)</span>
   <div class="row"><input id="au-c" placeholder="5-значный код" style="flex:1"><button class="sm btn-g" onclick="sendCode('${S.authMode}')"><i class="ri-mail-send-line"></i>Выслать код</button></div></div>`:''}
  ${reg?`<label class="row mut"><input type="checkbox" id="au-r" checked> Я принимаю <a onclick="showRules()">Правила проекта</a></label>`:''}
  <button class="btn w1" onclick="doAuth()"><i class="ri-check-double-line"></i>${reg?'Зарегистрироваться':'Войти в студию'}</button></div>`;
 loadCap();
}
async function sendCode(mode){
 const {ok,data}=await api('/api/auth/send-code',{body:{mode,username:$('au-u').value.trim(),email:$('au-e')?.value.trim()||'',challengeToken:S.cap?.challengeToken,captchaAnswer:$('cap-a').value.trim()}});
 toast(ok?'5-значный код отправлен на почту!':(data.error||'Ошибка отправки кода'));loadCap();
}
  async function doAuth(){
 const reg=S.authMode==='register',u=$('au-u').value.trim(),p=$('au-p').value,c=$('au-c')?.value.trim()||'',ca=$('cap-a').value.trim(),ct=S.cap?.challengeToken;
 if(reg&&!$('au-r').checked)return toast('Примите Правила проекта!');
 const {status,ok,data}=await api(reg?'/api/auth/register':'/api/auth/login',{body:reg?
  {username:u,email:$('au-e').value.trim(),password:p,refCode:$('au-ref').value.trim(),rulesAccepted:true,emailCode:c,challengeToken:ct,captchaAnswer:ca}:
  {username:u,password:p,emailCode:c,challengeToken:ct,captchaAnswer:ca}});
 if(status===403&&data.needEmailCode){S.needCode=true;renderAuth();return toast('Введите 5-значный код с почты!')}
 if(!ok){loadCap();return toast(data.error||'Ошибка авторизации')}
 S.tok=data.token;localStorage.setItem('nx_tok',S.tok);S.needCode=false;loadMe();
}
function fmtMsg(m,i){
 let h=esc(m.content||'');
 if(m.thinking)h=`<details class="think"><summary><i class="ri-brain-line"></i> Цепочка рассуждений ИИ</summary>${esc(m.thinking)}</details>`+h;
 h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>{
  if(l==='html'||c.includes('<html')||c.includes('<!DOCTYPE')||c.includes('<body')){
   S.sbx[i]=c;return`<pre>${c}</pre><button class="sm btn-g" onclick="runSbx(${i})"><i class="ri-play-fill"></i>Запустить HTML в песочнице</button>`;
  }return`<pre>${c}</pre>`;
 });
 return`<div class="msg ${m.role==='user'?'u':''}"><b>${m.role==='user'?'<i class="ri-user-line"></i> Вы':'<i class="ri-sparkling-line" style="color:var(--a)"></i> NEXUS AI'}</b><div style="margin-top:4px">${h}</div>${m.meta?`<div class="mut" style="margin-top:6px">${esc(m.meta)}</div>`:''}</div>`;
}
function runSbx(i){
 const d=(S.sbx[i]||'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
 openMod(`<div class="row sp" style="margin-bottom:8px"><b><i class="ri-window-line"></i> Интерактивная HTML-песочница</b><button class="sm" onclick="closeMod()">✕</button></div><iframe class="sbx" sandbox="allow-scripts"></iframe>`);
 $('mod-in').querySelector('iframe').srcdoc=d;
}
  async function doAuth(){
 const reg=S.authMode==='register',u=$('au-u').value.trim(),p=$('au-p').value,c=$('au-c')?.value.trim()||'',ca=$('cap-a').value.trim(),ct=S.cap?.challengeToken;
 if(reg&&!$('au-r').checked)return toast('Примите Правила проекта!');
 const {status,ok,data}=await api(reg?'/api/auth/register':'/api/auth/login',{body:reg?
  {username:u,email:$('au-e').value.trim(),password:p,refCode:$('au-ref').value.trim(),rulesAccepted:true,emailCode:c,challengeToken:ct,captchaAnswer:ca}:
  {username:u,password:p,emailCode:c,challengeToken:ct,captchaAnswer:ca}});
 if(status===403&&data.needEmailCode){S.needCode=true;renderAuth();return toast('Введите 5-значный код с почты!')}
 if(!ok){loadCap();return toast(data.error||'Ошибка авторизации')}
 S.tok=data.token;localStorage.setItem('nx_tok',S.tok);S.needCode=false;loadMe();
}
function fmtMsg(m,i){
 let h=esc(m.content||'');
 if(m.thinking)h=`<details class="think"><summary><i class="ri-brain-line"></i> Цепочка рассуждений ИИ</summary>${esc(m.thinking)}</details>`+h;
 h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>{
  if(l==='html'||c.includes('<html')||c.includes('<!DOCTYPE')||c.includes('<body')){
   S.sbx[i]=c;return`<pre>${c}</pre><button class="sm btn-g" onclick="runSbx(${i})"><i class="ri-play-fill"></i>Запустить HTML в песочнице</button>`;
  }return`<pre>${c}</pre>`;
 });
 return`<div class="msg ${m.role==='user'?'u':''}"><b>${m.role==='user'?'<i class="ri-user-line"></i> Вы':'<i class="ri-sparkling-line" style="color:var(--a)"></i> NEXUS AI'}</b><div style="margin-top:4px">${h}</div>${m.meta?`<div class="mut" style="margin-top:6px">${esc(m.meta)}</div>`:''}</div>`;

function runSbx(i){
 const d=(S.sbx[i]||'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
 openMod(`<div class="row sp" style="margin-bottom:8px"><b><i class="ri-window-line"></i> Интерактивная HTML-песочница</b><button class="sm" onclick="closeMod()">✕</button></div><iframe class="sbx" sandbox="allow-scripts"></iframe>`);
 $('mod-in').querySelector('iframe').srcdoc=d;
}

  async function sendChat(){

 S.msgs.push({role:'user',content:t});renderChat();

 if(!ok)return toast(data.error||'Ошибка ответа ИИ');
 let txt=String(data.text||'').replace(/\/\/SAVE:\s*(.+)/gi,(_,f)=>{f=f.trim();if(f&&!S.mem.includes(f))S.mem.push(f);return''}).trim();
 localStorage.setItem('nx_mem',JSON.stringify(S.mem));
 S.msgs.push({role:'assistant',content:txt,thinking:data.thinking||'',meta:`${data.provider||''}/${data.modelId||''} • ${data.costRub||0}₽ • ${data.inTok||0}/${data.outTok||0} ток.`});

}
