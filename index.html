<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS AI — Studio & API Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root {
  --bg: #090a0f;
  --s1: rgba(18, 20, 28, 0.88);
  --s2: #171a24;
  --s3: #222634;
  --b: rgba(255, 255, 255, 0.08);
  --bh: rgba(138, 180, 248, 0.45);
  --t: #f3f5fb;
  --m: #8e96aa;
  --a: #8ab4f8;
  --a2: #c58af9;
  --g: #34d399;
  --r: #f87171;
  --y: #fbbf24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--a); }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulseDot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: 0.5; } }
@keyframes glowBg { 0%, 100% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(25deg); } }

body {
  font: 14px/1.55 'Inter', system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(circle at 15% 0%, rgba(138, 180, 248, 0.14), transparent 45%),
    radial-gradient(circle at 85% 10%, rgba(197, 138, 249, 0.12), transparent 45%),
    var(--bg);
  color: var(--t);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}
code, pre, .mono { font-family: 'JetBrains Mono', monospace; }
a { color: var(--a); cursor: pointer; text-decoration: none; transition: 0.2s; }
a:hover { color: var(--a2); text-decoration: underline; }

button, input, select, textarea {
  font: inherit;
  color: var(--t);
  background: var(--s2);
  border: 1px solid var(--b);
  border-radius: 10px;
  padding: 9px 13px;
  outline: none;
  transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
}
input:focus, select:focus, textarea:focus {
  border-color: var(--a);
  box-shadow: 0 0 0 3px rgba(138, 180, 248, 0.16);
  background: #1d2130;
}
button {
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  user-select: none;
}
button:hover { border-color: var(--bh); background: var(--s3); transform: translateY(-1px); }
button:active { transform: translateY(0) scale(0.98); }

.btn {
  background: linear-gradient(135deg, var(--a), #669df6);
  color: #07101e;
  border: none;
  box-shadow: 0 4px 16px rgba(138, 180, 248, 0.28);
}
.btn:hover {
  background: linear-gradient(135deg, #a3c6ff, var(--a));
  box-shadow: 0 6px 22px rgba(138, 180, 248, 0.45);
  color: #07101e;
}
.btn-g { background: rgba(52, 211, 153, 0.14); color: var(--g); border-color: rgba(52, 211, 153, 0.35); }
.btn-g:hover { background: rgba(52, 211, 153, 0.24); border-color: var(--g); }
.btn-r { background: rgba(248, 113, 113, 0.14); color: var(--r); border-color: rgba(248, 113, 113, 0.35); }
.btn-r:hover { background: rgba(248, 113, 113, 0.24); border-color: var(--r); }

.sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
.mut { font-size: 12px; color: var(--m); }
.w1 { width: 100%; }
.hd { display: none !important; }
.lbl {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--m);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.top {
  height: 60px;
  background: rgba(12, 14, 20, 0.82);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--b);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 40;
}
.logo { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 9px; letter-spacing: -0.4px; }
.logo-ic {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, rgba(138,180,248,0.2), rgba(197,138,249,0.2));
  border: 1px solid rgba(138,180,248,0.4);
  display: flex; align-items: center; justify-content: center;
  color: var(--a); font-size: 19px;
  box-shadow: 0 0 16px rgba(138,180,248,0.25);
}
.logo span { background: linear-gradient(90deg, #fff, var(--a), var(--a2)); -webkit-background-clip: text; color: transparent; }
.dot-on { width: 8px; height: 8px; border-radius: 50%; background: var(--g); display: inline-block; animation: pulseDot 2s infinite; }

.wrap { display: flex; flex: 1; min-height: 0; }
.side {
  width: 245px;
  background: var(--s1);
  backdrop-filter: blur(18px);
  border-right: 1px solid var(--b);
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex-shrink: 0;
}
.nav {
  background: transparent;
  border: 1px solid transparent;
  justify-content: flex-start;
  padding: 10px 12px;
  border-radius: 11px;
  color: var(--m);
  font-weight: 500;
  width: 100%;
}
.nav i { font-size: 18px; color: var(--m); transition: 0.2s; }
.nav:hover { background: var(--s2); color: var(--t); transform: translateX(3px); }
.nav:hover i { color: var(--a); }
.nav.act {
  background: linear-gradient(90deg, rgba(138, 180, 248, 0.16), rgba(197, 138, 249, 0.06));
  color: var(--t);
  border-color: rgba(138, 180, 248, 0.3);
  box-shadow: inset 3px 0 0 var(--a);
}
.nav.act i { color: var(--a); }

.main { flex: 1; padding: 20px; overflow-y: auto; max-width: 1360px; width: 100%; margin: 0 auto; }
.card {
  background: var(--s1);
  backdrop-filter: blur(14px);
  border: 1px solid var(--b);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  animation: fadeIn 0.25s ease;
}
.card:hover { border-color: rgba(255, 255, 255, 0.14); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.sp { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 12px; }

.tag {
  font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 99px;
  background: var(--s2); border: 1px solid var(--b); color: var(--m);
  display: inline-flex; align-items: center; gap: 5px;
}
.tag.b { color: var(--a); background: rgba(138, 180, 248, 0.12); border-color: rgba(138, 180, 248, 0.3); }
.tag.g { color: var(--g); background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.3); }
.tag.r { color: var(--r); background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.3); }
.tag.y { color: var(--y); background: rgba(251, 191, 36, 0.12); border-color: rgba(251, 191, 36, 0.3); }

.studio-grid { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
.msgs { height: 56vh; min-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 8px; }
.msg {
  max-width: 88%; padding: 14px 16px; border-radius: 16px;
  background: var(--s2); border: 1px solid var(--b);
  white-space: pre-wrap; word-break: break-word; animation: fadeIn 0.2s ease;
}
.msg.u {
  align-self: flex-end;
  background: linear-gradient(135deg, #1b3358, #152238);
  border-color: rgba(138, 180, 248, 0.4);
}
.msg pre { background: #07080c; border: 1px solid var(--b); padding: 12px; border-radius: 10px; overflow-x:auto; margin: 8px 0; font-size: 12px; white-space: pre; }
.think { background: rgba(138, 180, 248, 0.07); border-left: 3px solid var(--a); padding: 8px 12px; margin-bottom: 8px; font-size: 12px; color: var(--m); border-radius: 6px; }
.bar { height: 9px; background: var(--s2); border-radius: 99px; overflow: hidden; margin: 6px 0; border: 1px solid var(--b); }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--a), var(--a2)); border-radius: 99px; transition: width 0.4s ease; }

.mod, .ban { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; z-index: 80; backdrop-filter: blur(10px); }
.mod { background: rgba(5, 6, 10, 0.78); }
.mod.on, .ban.on { display: flex; }
.mod-in { background: #141722; border: 1px solid var(--bh); border-radius: 18px; padding: 22px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; animation: fadeIn 0.2s ease; }
.ban { background: radial-gradient(circle, #4c0b0b, #140303); color: #fecaca; z-index: 100; text-align: center; flex-direction: column; }
.toast { position: fixed; bottom: 20px; right: 20px; background: #191d2b; border: 1px solid var(--a); box-shadow: 0 10px 30px rgba(0,0,0,0.6); padding: 12px 18px; border-radius: 12px; z-index: 95; display: none; animation: fadeIn 0.2s ease; }
.toast.on { display: flex; align-items: center; gap: 10px; }
.ad { background: linear-gradient(90deg, rgba(138,180,248,0.14), rgba(197,138,249,0.14)); border: 1px solid rgba(138,180,248,0.35); border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
iframe.sbx { width: 100%; height: 68vh; border: none; background: #fff; border-radius: 12px; }
.mob-btn { display: none; }
@media (max-width: 920px) {
  .studio-grid { grid-template-columns: 1fr; }
  .side { position: fixed; left: -260px; top: 60px; bottom: 0; z-index: 50; transition: 0.25s; }
  .side.on { left: 0; }
  .mob-btn { display: inline-flex; }
  .msg { max-width: 96%; }
}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <button class="mob-btn sm" onclick="document.getElementById('side').classList.toggle('on')"><i class="ri-menu-2-line"></i></button>
    <div class="logo">
      <div class="logo-ic"><i class="ri-sparkling-2-fill"></i></div>
      <span>NEXUS AI</span>
      <span class="tag b"><span class="dot-on"></span>STUDIO v5.1</span>
    </div>
  </div>
  <div id="stats-bar" class="row mut">
    <span class="tag"><i class="ri-user-3-line"></i>Юзеров: ...</span>
    <span class="tag"><i class="ri-cpu-line"></i>Моделей: ...</span>
    <span class="tag"><i class="ri-flashlight-line"></i>Запросов: ...</span>
  </div>
  <div id="top-user" class="row">
    <button class="btn sm" onclick="go('auth')"><i class="ri-login-box-line"></i>Войти</button>
  </div>
</header>

<div class="wrap">
  <aside id="side" class="side">
    <span class="lbl" style="padding:4px 8px">Рабочая студия</span>
    <button class="nav act" data-t="chat" onclick="go('chat')"><i class="ri-chat-voice-ai-line"></i>Чат AI Studio</button>
    <button class="nav" data-t="cat" onclick="go('cat')"><i class="ri-apps-2-line"></i>Каталог моделей</button>
    <button class="nav" data-t="sbx" onclick="go('sbx')"><i class="ri-code-s-slash-line"></i>HTML Песочница</button>
    <span class="lbl" style="padding:10px 8px 4px">Аккаунт и Маркет</span>
    <button class="nav" data-t="keys" onclick="go('keys')"><i class="ri-key-2-line"></i>Маркет API-ключей</button>
    <button class="nav" data-t="prof" onclick="go('prof')"><i class="ri-user-star-line"></i>Профиль и Квоты</button>
    <button class="nav" data-t="bill" onclick="go('bill')"><i class="ri-vip-crown-2-line"></i>Тарифы и Сбербанк</button>
    <span class="lbl" style="padding:10px 8px 4px">Управление</span>
    <button class="nav" id="nav-adm" data-t="adm" onclick="go('adm')"><i class="ri-shield-flash-line"></i>Админ-центр <span class="tag y" style="margin-left:auto;padding:1px 6px">ROOT</span></button>
    <div id="side-foot" class="mut" style="margin-top:auto;padding:10px;border-top:1px solid var(--b)">
      <div class="row sp"><span><i class="ri-shield-check-fill" style="color:var(--g)"></i> РФ 199-ФЗ</span><span class="mono">D1 Edge</span></div>
    </div>
  </aside>
  <main class="main">
    <div id="ad-box" class="ad hd"></div>
    <div id="view">
      <div class="card col" style="text-align:center;padding:40px">
        <i class="ri-loader-4-line" style="font-size:32px;color:var(--a)"></i>
        <h3>Загрузка рабочей среды NEXUS AI Studio...</h3>
      </div>
    </div>
  </main>
</div>
<div id="mod" class="mod" onclick="if(event.target===this)closeMod()"><div id="mod-in" class="mod-in"></div></div>
<div id="ban" class="ban"></div>
<div id="toast" class="toast"></div>
<script>
const API = 'https://omni-api.aegertcool.workers.dev';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

window.S = {
  tok: localStorage.getItem('nx_tok') || '',
  user: null,
  ad: null,
  cap: null,
  needCode: false,
  authMode: 'login',
  cat: [],
  mid: +localStorage.getItem('nx_mid') || 0,
  msgs: JSON.parse(localStorage.getItem('nx_msgs') || '[]'),
  mem: JSON.parse(localStorage.getItem('nx_mem') || '[]'),
  tab: 'chat',
  cStep: 0,
  sbx: [],
  admTab: 'orders'
};

function getDev() {
  let d = localStorage.getItem('nx_dev');
  if (!d) {
    d = 'd_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('nx_dev', d);
  }
  let s = navigator.userAgent + '|' + screen.width + 'x' + screen.height + '|' + navigator.language, h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return { d, h: 'hw_' + Math.abs(h).toString(16) };
}

function toast(m) {
  const t = $('toast');
  t.innerHTML = `<i class="ri-notification-badge-fill" style="color:var(--a);font-size:18px"></i><span>${esc(m)}</span>`;
  t.classList.add('on');
  clearTimeout(window._tTimer);
  window._tTimer = setTimeout(() => t.classList.remove('on'), 3600);
}

function openMod(h) { $('mod-in').innerHTML = h; $('mod').classList.add('on'); }
function closeMod() { $('mod').classList.remove('on'); }

async function api(p, o = {}) {
  try {
    const { d, h } = getDev();
    const r = await fetch(API + p, {
      method: o.method || (o.body ? 'POST' : 'GET'),
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + S.tok,
        'X-Device-Id': d,
        'X-Hw-Hash': h
      },
      body: o.body ? JSON.stringify(o.body) : undefined
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 403 && data.errorCode === 'DEVICE_BANNED') {
      showBan(data.reasons);
      throw new Error('DEVICE_BANNED');
    }
    return { status: r.status, ok: r.ok && data.ok !== false, data };
  } catch (e) {
    if (e.message === 'DEVICE_BANNED') throw e;
    return { status: 0, ok: false, data: { error: 'Ошибка соединения с сервером' } };
  }
}

function showBan(rs) {
  const b = $('ban');
  b.classList.add('on');
  b.innerHTML = `
    <div class="card col" style="max-width:500px;background:#2a0909;border-color:var(--r)">
      <h2>⚠️⚠️ ИЗВИНИТЕ, НО ВЫ ЗАБАНЕНЫ ПО ЭТОЙ ПРИЧИНЕ ⚠️⚠️</h2>
      <div class="card" style="background:#1a0505;color:#fca5a5">${esc(Array.isArray(rs) ? rs.join(', ') : (rs || 'Нарушение правил безопасности'))}</div>
      <div style="text-align:left"><span class="lbl">Ваш никнейм</span><input id="ban-u" class="w1" value="${esc(S.user?.username || '')}"></div>
      <div style="text-align:left"><span class="lbl">Текст апелляции</span><textarea id="ban-m" class="w1" rows="3" placeholder="Объясните ситуацию для разблокировки..."></textarea></div>
      <button class="btn w1" onclick="sendAppeal()"><i class="ri-mail-send-line"></i>Отправить обжалование</button>
    </div>`;
}

async function sendAppeal() {
  const { ok, data } = await api('/api/ban/appeal', { body: { username: $('ban-u').value, message: $('ban-m').value } });
  toast(ok ? 'Апелляция отправлена на рассмотрение!' : (data.error || 'Ошибка отправки'));
}

function renderAd(a) {
  if (!a) return;
  S.ad = a;
  const b = $('ad-box');
  if (!a.enabled) { b.classList.add('hd'); return; }
  b.classList.remove('hd');
  b.innerHTML = `<div class="row"><span class="tag b"><i class="ri-megaphone-line"></i>Партнёр</span><b>${esc(a.title)}</b><span class="mut">${esc(a.text)}</span></div>` +
    (a.url ? `<a class="btn sm" target="_blank" href="${esc(a.url)}">Перейти <i class="ri-arrow-right-up-line"></i></a>` : '');
}

async function loadStats() {
  const { ok, data } = await api('/api/stats');
  if (ok) {
    $('stats-bar').innerHTML = `
      <span class="tag"><i class="ri-user-3-line" style="color:var(--a)"></i>Юзеров: <b>${data.users || 0}</b></span>
      <span class="tag"><i class="ri-cpu-line" style="color:var(--a2)"></i>Моделей: <b>${data.models || 0}</b></span>
      <span class="tag"><i class="ri-flashlight-line" style="color:var(--g)"></i>Запросов: <b>${data.requests || 0}</b></span>`;
    renderAd(data.ad);
  }
}

async function loadMe() {
  if (!S.tok) {
    $('top-user').innerHTML = `<button class="btn sm" onclick="go('auth')"><i class="ri-login-box-line"></i>Войти / Регистрация</button>`;
    return go(S.tab === 'cat' || S.tab === 'adm' || S.tab === 'sbx' ? S.tab : 'auth');
  }
  const { ok, data } = await api('/api/auth/me');
  if (!ok) {
    S.tok = ''; localStorage.removeItem('nx_tok');
    $('top-user').innerHTML = `<button class="btn sm" onclick="go('auth')"><i class="ri-login-box-line"></i>Войти</button>`;
    return go('auth');
  }
  S.user = data.user;
  renderAd(data.ad);
  const w = S.user.wallet?.balanceRub || 0;
  $('top-user').innerHTML = `
    <span class="tag g" onclick="go('prof')" style="cursor:pointer"><i class="ri-wallet-3-line"></i>${w} ₽</span>
    <span class="tag b"><i class="ri-vip-diamond-line"></i>${esc(S.user.plan || 'FREE')}</span>
    <b>${esc(S.user.username)}</b>
    <button class="sm btn-r" onclick="logout()" title="Выйти"><i class="ri-logout-box-r-line"></i></button>`;
  go(S.tab === 'auth' ? 'chat' : S.tab);
}

function logout() { S.tok = ''; S.user = null; localStorage.removeItem('nx_tok'); loadMe(); }

function go(t) {
  $('side').classList.remove('on');
  if (!S.tok && !['auth', 'cat', 'adm', 'sbx'].includes(t)) t = 'auth';
  S.tab = t;
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('act', n.dataset.t === t));
  if (t === 'auth') renderAuth();
  else if (t === 'chat') renderChat();
  else if (t === 'cat') renderCat();
  else if (t === 'sbx') renderSbxPage();
  else if (t === 'keys') renderKeys();
  else if (t === 'prof') renderProf();
  else if (t === 'bill') renderBill();
  else if (t === 'adm') renderAdm();
}

async function loadCap() {
  const { ok, data } = await api('/api/captcha/challenge');
  if (ok) { S.cap = data; if ($('cap-q')) $('cap-q').textContent = data.question; }
}

function showRules() {
  openMod(`
    <div class="col">
      <h3><i class="ri-scales-3-line" style="color:var(--a)"></i> Правила платформы NEXUS AI (199-ФЗ РФ)</h3>
      <div class="card col mut" style="margin:0;background:var(--s2)">
        <p><b>1. Законодательство РФ (199-ФЗ):</b> Регистрация и авторизация осуществляются напрямую через логин и подтверждённую электронную почту без использования зарубежных OAuth-провайдеров (Google, Apple, Telegram).</p>
        <p><b>2. Защита от мультиаккаунтов:</b> На платформе действует аппаратная защита по отпечатку устройства (Hardware Hash). Попытки абуза бесплатных лимитов приводят к блокировке устройства.</p>
        <p><b>3. Маркетплейс ключей:</b> Владельцы API-ключей получают вознаграждение за использование их моделей другими участниками.</p>
      </div>
      <button class="btn w1" onclick="closeMod()"><i class="ri-check-line"></i>Понятно, принимаю</button>
    </div>`);
}

function renderAuth() {
  const reg = S.authMode === 'register';
  $('view').innerHTML = `
    <div class="card col" style="max-width:460px;margin:20px auto">

<script>
function fmtMsg(m, i) {
  let h = esc(m.content || '');
  if (m.thinking) {
    h = `<details class="think"><summary><i class="ri-brain-line"></i> Показать размышления модели (Thinking)</summary><div style="margin-top:6px">${esc(m.thinking)}</div></details>` + h;
  }
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => {
    const isH = l.toLowerCase() === 'html' || c.includes('<html') || c.includes('<!DOCTYPE') || c.includes('<body') || c.includes('<canvas');
    S.sbx[i] = c;
    return `<div style="margin:8px 0"><div class="row sp mut" style="background:#11131c;padding:5px 10px;border-radius:8px 8px 0 0;border:1px solid var(--b)"><span><i class="ri-code-line"></i> ${esc(l || 'code')}</span>` +
      (isH ? `<button class="sm btn-g" onclick="runSbx(${i})"><i class="ri-play-fill"></i>Запустить в песочнице</button>` : '') +
      `</div><pre style="margin:0;border-radius:0 0 8px 8px">${c}</pre></div>`;
  });
  return `
    <div class="msg ${m.role === 'user' ? 'u' : ''}">
      <div class="row sp" style="margin-bottom:4px">
        <b>${m.role === 'user' ? '<i class="ri-user-smile-line"></i> Вы' : '<i class="ri-sparkling-2-fill" style="color:var(--a)"></i> NEXUS AI'}</b>
        ${m.meta ? `<span class="mut mono">${esc(m.meta)}</span>` : ''}
      </div>
      <div>${h}</div>
    </div>`;
}

function runSbx(i) {
  const d = (S.sbx[i] || '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  openMod(`
    <div class="row sp" style="margin-bottom:10px">
      <h3><i class="ri-window-2-line" style="color:var(--g)"></i> Интерактивная HTML Песочница</h3>

}

async function sendChat() {
  const t = $('ch-in').value.trim();
  if (!t || !S.mid) return toast('Выберите модель и введите текст запроса!');
  const mode = $('ch-mode').value, br = $('ch-br').value, temp = +$('ch-t').value || 0.7, sp = $('ch-sp').value.trim();
  S.msgs.push({ role: 'user', content: t });
  renderChat();
  const { ok, data } = await api('/api/chat', {
    body: { modelRowId: S.mid, messages: S.msgs.map(m => ({ role: m.role, content: m.content })), mode, brainLevel: br, memoryFacts: S.mem, secretPrompt: sp, temperature: temp }
  });
  if (!ok) return toast(data.error || 'Ошибка ответа нейросети');
  let txt = String(data.text || '').replace(/\/\/SAVE:\s*(.+)/gi, (_, f) => {
    f = f.trim(); if (f && !S.mem.includes(f)) S.mem.push(f); return '';
  }).trim();
  localStorage.setItem('nx_mem', JSON.stringify(S.mem));
  S.msgs.push({
    role: 'assistant', content: txt, thinking: data.thinking || '',
    meta: `${data.provider || ''}/${data.modelId || ''} • ${data.costRub || 0} ₽ • ${data.inTok || 0}/${data.outTok || 0} tok`
  });
  localStorage.setItem('nx_msgs', JSON.stringify(S.msgs));
  renderChat();
}

        <div class="row sp"><h3><i class="ri-user-star-line" style="color:var(--a)"></i> ${esc(u.username || 'Профиль')}</h3><span class="tag b">${esc(u.plan || 'FREE')}</span></div>
        <div class="mut">Email: ${esc(u.email || '-')} • Реф-код: <b class="mono" style="color:var(--a)">${esc(u.refCode || '-')}</b></div>
        ${u.isQuarantined ? `<div class="tag r">⚠️ Карантин до ${esc(u.quarantineUntil)}</div>` : ''}
        <div><span class="lbl">Квота 5 часов (${l.used5h || 0} / ${l.cap5h || 0})</span>${bar(l.used5h, l.cap5h)}</div>
        <div><span class="lbl">Недельная квота (${l.usedWeek || 0} / ${l.capWeek || 0})</span>${bar(l.usedWeek, l.capWeek)}</div>
        <div><span class="lbl">Месячная квота (${l.usedMonth || 0} / ${l.capMonth || 0})</span>${bar(l.usedMonth, l.capMonth)}</div>
        <div class="mut">Бесплатные запросы: ${l.freeReqsUsed || 0}/${l.freeReqsLimit || 0} • Вечная память: ${l.infiniteMem ? 'Активна' : 'Нет'}</div>
        <div class="row">
          <button class="btn-g sm" onclick="pAct('/api/bonus/checkin',{})"><i class="ri-gift-line"></i>Ежедневный бонус (${u.checkinStreak || 0} дн.)</button>
          <input id="prm-c" placeholder="Промокод" style="flex:1">
          <button class="btn sm" onclick="pAct('/api/promo/redeem',{code:$('prm-c').value})">ОК</button>
        </div>
      </div>
      <div class="card col">
        <h3><i class="ri-wallet-3-line" style="color:var(--g)"></i> Кошелёк: ${w.balanceRub || 0} ₽</h3>
        <div class="mut">Всего заработано: ${w.totalEarnedRub || 0} ₽ (вывод доступен от ${w.minWithdrawRub || 300} ₽)</div>
        <div class="row">
          <input id="wd-d" placeholder="Реквизиты СБП / номер карты" style="flex:1">
          <button class="btn sm" onclick="if((${w.balanceRub || 0})<300)return toast('Вывод от 300 ₽!');pAct('/api/wallet/withdraw',{details:$('wd-d').value})">Вывести</button>
        </div>
        <span class="lbl" style="margin-top:8px"><i class="ri-smartphone-line"></i>Активные устройства</span>
        ${(u.devices || []).map(d => `
          <div class="row sp mut">
            <span>${esc(d.device_id || d.id)} ${d.trusted ? '✅' : ''}</span>
            <div class="row">
              <button class="sm btn-g" onclick="pAct('/api/devices/trust',{deviceRowId:${d.id}})">Доверять</button>
              <button class="sm btn-r" onclick="pAct('/api/devices/kick',{deviceRowId:${d.id}})">Кик</button>
            </div>
          </div>`).join('') || '<span class="mut">Нет данных об устройствах</span>'}
      </div>
    </div>`;
}

async function pAct(p, b) { const { ok, data } = await api(p, { body: b }); toast(ok ? 'Успешно выполнено!' : (data.error || 'Ошибка')); loadMe(); }

async function renderBill() {
  const { data } = await api('/api/billing/info'); S.cStep = 0;
  $('view').innerHTML = `
    <div class="card col" style="max-width:600px;margin:0 auto">
      <div class="row sp"><h3><i class="ri-vip-crown-2-line" style="color:var(--y)"></i> Тарифы и оплата через Сбербанк</h3><span class="tag g">Автоматическая заявка</span></div>
      <div class="card" style="margin:0;background:var(--s2)">
        <span class="lbl">Реквизиты для перевода</span>
        <div>Банк: <b>${esc(data.bank || 'Сбербанк')}</b> • Телефон: <b class="mono" style="color:var(--a)">${esc(data.phone || 'Уточните у админа')}</b> (${esc(data.username || '')})</div>
      </div>
      <div><span class="lbl">Ваш никнейм</span><input id="bl-n" class="w1" value="${esc(S.user?.username || '')}"></div>
      <div><span class="lbl">Имя отправителя и сумма перевода</span><input id="bl-s" class="w1" placeholder="Например: Александр П., перевёл 500₽ на Сбер"></div>
      <div class="row">
        <button class="btn" style="flex:1" onclick="ordB('buy_pro')"><i class="ri-flashlight-fill"></i>PRO — 500 ₽</button>
        <button class="btn" style="flex:1" onclick="ordB('buy_ultra')"><i class="ri-fire-fill"></i>ULTRA — 1490 ₽</button>
        <button class="btn-g" style="flex:1" onclick="ordB('reset_5h')"><i class="ri-refresh-line"></i>Сброс 5ч — 250/500 ₽</button>
      </div>
      <button class="sm btn-r w1" id="ca-b" onclick="canAuto()"><i class="ri-close-circle-line"></i>Отменить автооплату (в 3 клика)</button>
    </div>`;
}

async function ordB(t) {
  const { ok, data } = await api('/api/billing/order', { body: { itemType: t, customNick: $('bl-n').value, senderNote: $('bl-s').value } });
  toast(ok ? 'Заявка отправлена администратору!' : (data.error || 'Ошибка отправки'));
}

async function canAuto() {
  S.cStep++;
  if (S.cStep < 3) $('ca-b').innerHTML = `<i class="ri-alert-line"></i>Подтвердите отмену автооплаты (Клик ${S.cStep + 1} из 3)`;
  else { await pAct('/api/billing/cancel-auto', {}); S.cStep = 0; }
}

async function adm(p, b, m = 'POST') {
  const r = await api('/api/admin/' + p, { method: m, body: b });
  toast(r.ok ? 'Успешно сохранено!' : (r.data.error || 'Нужен вход под аккаунтом asdcreator'));
  if (r.ok) renderAdm();
}

async function renderAdm() {
  const { ok, data } = await api('/api/admin/overview');
  const d = data || {}, pc = d.payConfig || {}, ad = d.ad || {};
  $('view').innerHTML = `
    <div class="card row sp">
      <div>
        <h3><i class="ri-shield-flash-line" style="color:var(--a)"></i> Админ-центр NEXUS AI (asdcreator)</h3>
        <span class="mut">Управление заказами Сбербанка, тарифами, рекламой и модерацией</span>
      </div>
      <span class="tag ${ok ? 'g' : 'r'}">${ok ? '✅ Доступ открыт (ROOT)' : '⚠️ Войдите как asdcreator (' + esc(d.error || 'гость') + ')'}</span>
    </div>
    <div class="grid">
      <div class="card col">
        <h4><i class="ri-shopping-bag-3-line" style="color:var(--g)"></i> Заказы подписок и сброса</h4>
        ${(d.orders || []).map(o => `
          <div class="row sp mut" style="padding:6px 0;border-bottom:1px solid var(--b)">
            <span><b>${esc(o.custom_nick || o.username)}</b>: ${esc(o.item_type)} (${esc(o.sender_note || '')})</span>
            <div class="row">
              <button class="sm btn-g" onclick="adm('order-resolve',{orderId:${o.id},approve:true})">Выдать</button>
              <button class="sm btn-r" onclick="adm('order-resolve',{orderId:${o.id},approve:false})">✕</button>
            </div>
          </div>`).join('') || '<span class="mut">Ожидающих заказов нет</span>'}
      </div>
      <div class="card col">
        <h4><i class="ri-bank-card-line" style="color:var(--a)"></i> Реквизиты Сбер и Telegram-бот</h4>
        <input id="ap-p" placeholder="Телефон Сбербанка" value="${esc(pc.phone || '')}">
        <input id="ap-b" placeholder="Банк (Сбербанк)" value="${esc(pc.bank || 'Сбербанк')}">
        <input id="ap-t" placeholder="Telegram Bot Token" value="${esc(pc.tgToken || '')}">
        <input id="ap-c" placeholder="Telegram Chat ID" value="${esc(pc.tgChatId || '')}">
        <button class="btn sm" onclick="adm('pay-config',{phone:$('ap-p').value,bank:$('ap-b').value,tgToken:$('ap-t').value,tgChatId:$('ap-c').value})"><i class="ri-save-line"></i>Сохранить настройки</button>
      </div>
      <div class="card col">
        <h4><i class="ri-megaphone-line" style="color:var(--y)"></i> Рекламный баннер</h4>
        <label class="row mut"><input type="checkbox" id="aa-e" ${ad.enabled ? 'checked' : ''}> Показывать рекламу на сайте</label>
        <input id="aa-t" placeholder="Заголовок" value="${esc(ad.title || '')}">
        <input id="aa-x" placeholder="Текст" value="${esc(ad.text || '')}">
        <input id="aa-u" placeholder="Ссылка (https://...)" value="${esc(ad.url || '')}">
        <button class="btn sm" onclick="adm('ad',{enabled:$('aa-e').checked,title:$('aa-t').value,text:$('aa-x').value,url:$('aa-u').value})">Сохранить баннер</button>
      </div>
      <div class="card col">
        <h4><i class="ri-coupon-3-line" style="color:var(--a2)"></i> Промокоды</h4>
        <div class="row">
          <input id="pr-c" placeholder="Код" style="flex:1">
          <select id="pr-p"><option>PRO</option><option>ULTRA</option></select>
          <input id="pr-d" value="30" style="width:65px" title="Дней">
          <button class="sm btn" onclick="adm('promo',{code:$('pr-c').value,plan:$('pr-p').value,days:+$('pr-d').value})">Создать</button>
        </div>
        ${(d.promos || []).map(p => `<div class="row sp mut"><span><b>${esc(p.code)}</b> (${esc(p.plan)})</span><button class="sm btn-r" onclick="adm('promo/'+encodeURIComponent('${esc(p.code)}'),null,'DELETE')">✕</button></div>`).join('')}
      </div>
      <div class="card col">
        <h4><i class="ri-group-line" style="color:var(--a)"></i> Пользователи (${(d.users || []).length})</h4>
        ${(d.users || []).map(u => `
          <div class="row sp mut">
            <span><b>${esc(u.username)}</b> [${esc(u.plan)}]</span>
            <div class="row">
              <select id="up-${u.id}"><option>FREE</option><option>PRO</option><option>ULTRA</option></select>
              <button class="sm btn-g" onclick="adm('user-plan',{targetUserId:${u.id},plan:$('up-${u.id}').value,days:30})">Выдать</button>
              <button class="sm btn-r" onclick="adm('user-ban',{targetUserId:${u.id},ban:${!u.is_banned}})">${u.is_banned ? 'Разбан' : 'Бан'}</button>
            </div>
          </div>`).join('') || '<span class="mut">Список доступен после входа в админ-аккаунт</span>'}
      </div>
      <div class="card col">
        <h4><i class="ri-scales-line" style="color:var(--r)"></i> Апелляции, Ключи и Безопасность</h4>
        ${(d.appeals || []).map(a => `<div class="row sp mut"><span>${esc(a.username)}: ${esc(a.message)}</span><button class="sm btn-g" onclick="adm('appeal',{appealId:${a.id},id:${a.id},approve:true})">Разбан</button></div>`).join('')}
        ${(d.keys || []).map(k => `<div class="row sp mut"><span>🔑 ${esc(k.title || k.id)}</span><button class="sm btn-r" onclick="adm('key/${k.id}',null,'DELETE')">Удалить</button></div>`).join('')}
        <div class="mut">Реф-топ: ${(d.refTop || []).map(r => esc(r.username) + ':' + (r.cnt || r.count || 0)).join(', ') || 'нет'} • Алертов: ${(d.alerts || []).length}</div>
      </div>
    </div>`;
}

loadStats();
loadMe();
</script>
</body>
</html>
